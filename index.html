<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>インフレアドベンチャー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#05061a;color:#fff;font-family:'DotGothic16',monospace;font-size:15px;line-height:1.5}
#app{max-width:480px;margin:0 auto;padding:10px 10px 40px}
h1{font-size:22px;text-align:center;margin:8px 0 2px;letter-spacing:2px;color:#ffe066;text-shadow:2px 2px 0 #a33}
.sub{text-align:center;font-size:12px;color:#9ab;margin-bottom:10px}
.win{background:linear-gradient(#2b44b8,#0c1766);border:3px solid #fff;border-radius:7px;padding:10px 12px;margin:10px 0;box-shadow:0 0 0 2px #000,4px 4px 0 2px #000a}
.win h2{font-size:15px;margin:0 0 6px;color:#ffe066}
button{font-family:inherit;font-size:14px;color:#fff;background:#0a0f3d;border:2px solid #fff;border-radius:5px;padding:7px 8px;cursor:pointer}
button:active{background:#33f}
button:disabled{opacity:.35}
button.sel{background:#c33;border-color:#ffe066}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed #fff3}
.row:last-child{border-bottom:0}
.small{font-size:12px;color:#bcd}
.y{color:#ffe066}.r{color:#ff6b6b}.g{color:#7dff9a}.c{color:#7de0ff}
input{font-family:inherit;font-size:16px;padding:6px;width:100%;background:#000;color:#fff;border:2px solid #fff;border-radius:5px}
.bar{height:8px;background:#000;border:1px solid #fff;border-radius:3px;overflow:hidden;margin:3px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7dff9a,#ffe066)}
canvas{image-rendering:pixelated;width:84px;height:84px}
#stage{display:flex;justify-content:space-around;align-items:flex-end;background:linear-gradient(#123 60%,#243 60%);border:3px solid #fff;border-radius:7px;padding:10px;margin-top:8px}
#stage div{text-align:center;font-size:12px;max-width:45%}
#log{height:46vh;overflow-y:auto;font-size:13px}
#log p{margin:0 0 3px}
.dmg{color:#ffe066;font-size:15px}
.dmg.big{font-size:18px;color:#ff9f43}
.edmg{color:#ff6b6b}
.crit{color:#ff5e5e;font-weight:bold}
.mir{font-size:17px;background:linear-gradient(90deg,#f55,#fd5,#5f8,#5df,#a5f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sk{color:#7de0ff}
.heal{color:#7dff9a}
.hpl{color:#9ab;font-size:11px}
.lv{color:#ffe066;font-size:15px}
.rw{color:#7dff9a}
.hide{display:none!important}
.o{color:#ffa94d}
#bBar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:#05061aee;padding:8px 10px 14px;display:grid;grid-template-columns:2fr 1fr;gap:8px;z-index:10;border-top:2px solid #fff3}
#bBar button{padding:18px 6px;font-size:16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#btnAgain.holding{background:#c33;border-color:#ffe066}
#sBattle{padding-bottom:100px}
.card{display:inline-block;background:#fff;color:#000;border-radius:6px;padding:14px 8px;font-size:28px;min-width:66px;text-align:center;border:3px solid #ffe066}
.card.red{color:#d00}
.card.back{background:repeating-linear-gradient(45deg,#33a,#33a 6px,#227 6px,#227 12px);color:transparent}
#reels{display:flex;justify-content:center;gap:6px;margin:8px 0}
.reel{width:76px;height:64px;background:#000;border:3px solid #ffe066;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px}
.numgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.numgrid button{padding:5px 0;font-size:12px}
.numgrid button.redn{background:#811}
.big{font-size:30px;text-align:center;margin:6px 0}
#modal{position:fixed;inset:0;background:#000a;z-index:20;display:none;}
#modal:not(.hide){display:flex;}
#modal{align-items:center;justify-content:center;padding:20px}
#modal .win{max-width:420px;width:100%;text-align:center}
#toast{position:fixed;top:10px;pointer-events:none;left:50%;transform:translateX(-50%);z-index:30;background:linear-gradient(#5a3a00,#2a1a00);border:2px solid #ffe066;border-radius:7px;padding:8px 14px;font-size:14px;max-width:90vw;transition:opacity .3s;pointer-events:none}
rt{font-size:9px;color:#bcd}
#casMsg{min-height:1.6em;margin-top:6px;text-align:center}
#result{font-size:14px}
.logbox{max-height:50vh;overflow-y:auto;font-size:13px}
.logbox p{margin:0 0 3px}
.tag{font-size:11px;border:1px solid #fff6;border-radius:3px;padding:0 4px;margin-left:4px}
.title-spr{display:flex;justify-content:center;gap:10px;margin:8px 0}
.title-spr canvas{width:48px;height:48px;cursor:pointer;touch-action:manipulation}
@keyframes a-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
@keyframes a-flap{0%,100%{transform:translateY(0)}25%{transform:translateY(-8px) scaleX(.8)}50%{transform:translateY(0)}75%{transform:translateY(-8px) scaleX(.8)}}
@keyframes a-spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes a-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-8deg)}40%{transform:translateX(4px) rotate(8deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes a-roar{0%,100%{transform:scale(1)}30%{transform:scale(1.25) translateY(-4px)}60%{transform:scale(.95)}}
.a-jump{animation:a-jump .25s ease-out}.a-flap{animation:a-flap .35s ease-in-out}.a-spin{animation:a-spin .4s ease-in-out}.a-shake{animation:a-shake .35s}.a-roar{animation:a-roar .4s ease-out}
</style>
</head>
<body>
<div id="toast" class="hide"></div>
<div id="app">
  <h1>インフレアドベンチャー</h1>
  <div class="sub">― 桁がおかしくなるまで戦え ―</div>

  <!-- タイトル -->
  <div id="sTitle" class="hide">
    <div class="title-spr" id="titleSpr"></div>
    <div class="win">
      <button id="btnCont" style="width:100%;padding:14px;font-size:17px" onclick="goMain()">つづきから</button>
      <div class="small" id="contInfo" style="text-align:center;margin-top:4px"></div>
      <button id="btnNew" style="width:100%;margin-top:10px" onclick="openNew()">はじめから</button>
      <button style="width:100%;margin-top:6px;font-size:12px" onclick="$('#impBoxT').classList.toggle('hide')">セーブコードから復元する</button>
      <div id="impBoxT" class="hide" style="margin-top:8px">
        <div class="small">書き出しておいたセーブコードを貼り付けてください。</div>
        <textarea id="impTextT" rows="4" style="width:100%;font-size:11px;background:#000;color:#fff;border:2px solid #fff;border-radius:5px"></textarea>
        <button id="impBtnT" style="width:100%;margin-top:4px" onclick="importSave('T')">読み込む</button>
        <div id="impMsgT" class="small" style="text-align:center;margin-top:4px"></div>
      </div>
    </div>
    <div class="win hide" id="newBox">
      <h2>キャラクター作成</h2>
      <div class="small">名前</div>
      <input id="inName" maxlength="10" value="" placeholder="主人公の名前（空欄ならランダム）" autocomplete="off">
      <div class="small" style="margin-top:8px">職業</div>
      <div class="grid2" id="jobPick"></div>
      <div class="small" id="jobDesc" style="margin:8px 0;min-height:2.5em"></div>
      <div class="small r hide" id="newWarn" style="margin-bottom:6px">※いまのセーブデータは消えます</div>
      <button id="btnStart" style="width:100%" onclick="startNew()">冒険をはじめる</button>
    </div>
    <div id="credit" class="small" style="text-align:center;color:#789;margin-top:14px;line-height:1.7">
      © 2026 Amane-pipippi0630 ／ MIT License<br>
      フォント：DotGothic16（Fontworks・SIL Open Font License 1.1）<br>
      ※スクウェア・エニックスおよび関連作品とは関係のない非公式ファンメイド作品です
    </div>
  </div>

  <!-- メイン -->
  <div id="sMain" class="hide">
    <div class="win" id="status"></div>
    <div class="win">
      <div class="grid">
        <button onclick="panel('area')">冒険</button>
        <button onclick="panel('champ')">闘技場</button>
        <button onclick="panel('job')">転職所</button>
        <button onclick="panel('wpn')">武器屋</button>
        <button onclick="panel('arm')">防具屋</button>
        <button onclick="panel('acc')">装飾品屋</button>
        <button onclick="panel('reb')">転生の祭壇</button>
        <button onclick="panel('stat')">能力振り</button>
        <button onclick="panel('casino')" class="y">ギャンブル場</button>
      </div>
      <div class="grid" style="margin-top:6px;grid-template-columns:repeat(4,1fr)">
        <button onclick="panel('bar')" class="y">酒場</button>
        <button onclick="panel('ach')" class="y">実績</button>
        <button onclick="panel('log')">戦闘ログ</button>
        <button onclick="panel('rec')">記録</button>
      </div>
    </div>
    <div class="win" id="panel"></div>
  </div>

  <!-- 戦闘 -->
  <div id="sBattle" class="hide">
    <div id="stage">
      <div><canvas id="cvP"></canvas><div id="nmP"></div></div>
      <div class="y" style="align-self:center">VS</div>
      <div><canvas id="cvE"></canvas><div id="nmE"></div></div>
    </div>
    <div class="win" id="result"></div>
    <div class="win"><div id="log" class="logbox"></div></div>
    <div id="modal" class="hide" onclick="if(event.target===this)closeModal()"><div class="win">
      <h2 id="mTitle"></h2><div id="mBody" class="small" style="margin-bottom:10px"></div>
      <div class="grid2"><button id="mGo" class="y">次のエリアへ進む</button><button id="mStay">このまま続ける</button></div>
    </div></div>
    <div id="bBar">
      <button id="btnAgain">もう一戦（長押しで連戦）</button>
      <button onclick="goMain()">戻る</button>
    </div>
  </div>
</div>

function sanitizeSave(o){
  const num=(v,d=0)=>{ v=Number(v); return Number.isFinite(v)?v:d; };

  const numMap=(m,keyOk)=>{ const r={}; if(m&&typeof m==='object') for(const k of Object.keys(m)) if(isKey(k)&&(!keyOk||keyOk(k))) r[k]=num(m[k]); return r; };
  const boolMap=(m,keyOk)=>{ const r={}; if(m&&typeof m==='object') for(const k of Object.keys(m)) if(isKey(k)&&(!keyOk||keyOk(k))&&m[k]) r[k]=true; return r; };
  const isJob=k=>Object.prototype.hasOwnProperty.call(JOBS,k);

  r.name=String(o.name==null?'ななし':o.name).replace(/[\u0000-\u001f<>&"'`]/g,'').slice(0,10)||'ななし';
  r.job=isJob(o.job)?o.job:'warrior';
  r.yomi=typeof o.yomi==='string'&&/^[ぁ-ゖー]{1,15}$/.test(o.yomi)?o.yomi:'';
  ['lv','exp','gold','pts','wpn','arm','reb','maxArea','areaWins','champ','kills','maxDmg','battles','earned','maxLv','godTries','godWins','godMaxForm',
   'jackpots','j777','jpin','jrou','setHits','hlBest','allInWins','kajiN','miracles'].forEach(k=>r[k]=num(o[k],0));
  r.lv=Math.max(1,int(o.lv,1)); r.wpn=Math.min(GEAR_MAX,int(o.wpn)); r.arm=Math.min(GEAR_MAX,int(o.arm)); r.reb=int(o.reb); r.pts=int(o.pts);
  r.maxArea=Math.min(AREA_MAX,int(o.maxArea)); r.areaWins=int(o.areaWins); r.champ=int(o.champ);
  r.rebMul=Math.max(1,num(o.rebMul,1)); r.oneG=bool(o.oneG); r.areaDone=bool(o.areaDone);
  r.base={}; KEYS.forEach(k=>r.base[k]=Math.max(0,num(o.base&&o.base[k],1)));
  r.jlv={}; if(o.jlv&&typeof o.jlv==='object') for(const k of Object.keys(o.jlv)) if(isJob(k)&&o.jlv[k]) r.jlv[k]={lv:Math.min(JMAX,Math.max(1,int(o.jlv[k].lv,1))),exp:int(o.jlv[k].exp)};
  r.acc=numMap(o.acc,k=>ACC.some(a=>a[0]===k)); Object.keys(r.acc).forEach(k=>r.acc[k]=Math.min(ACC_LIMIT,int(r.acc[k])));
  const eq=Array.isArray(o.accEq)?o.accEq:(o.accEq?[o.accEq]:[]); r.accEq=eq.filter(k=>ACC.some(a=>a[0]===k)).slice(0,ACC.length);

// IA2: 実績を名前の一覧にまとめ、小数を丸め、deflateで圧縮してURL安全なbase64に（IA1は旧形式・読み込みのみ）
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};

async function pipe(u8,stream){ const w=stream.writable.getWriter(); w.write(u8); w.close(); return new Uint8Array(await new Response(stream.readable).arrayBuffer()); }
async function makeCode(){
  const o=JSON.parse(JSON.stringify(P)); o.ach=Object.keys(P.ach||{}).join(',');
  const json=JSON.stringify(o,(k,v)=>typeof v==='number'&&!Number.isInteger(v)?+v.toPrecision(10):v);
  if(typeof CompressionStream==='undefined') return 'IA1:'+btoa(unescape(encodeURIComponent(JSON.stringify(P))));
  return 'IA2:'+b64u(await pipe(new TextEncoder().encode(json),new CompressionStream('deflate-raw')));
}
async function parseCode(t){ t=(t||'').replace(/\s+/g,''); let o;
  if(t.length>200000) throw new Error('セーブコードが長すぎます');
  if(t.startsWith('IA2:')){ if(typeof DecompressionStream==='undefined') throw new Error('このブラウザでは読み込めません（ブラウザを最新にしてください）');
    o=JSON.parse(new TextDecoder().decode(await pipe(ub64u(t.slice(4)),new DecompressionStream('deflate-raw')))); }
  else if(t.startsWith('IA1:')) o=JSON.parse(decodeURIComponent(escape(atob(t.slice(4)))));
  else throw new Error('セーブコードの形式が違います');
  if(!o||typeof o!=='object'||!o.name||!o.job||!o.base) throw new Error('セーブデータが壊れています');
  if(typeof o.ach==='string'){ const a={}; o.ach.split(',').filter(Boolean).forEach(id=>a[id]=1); o.ach=a; }
  return sanitizeSave(o); }

// ============ 能力計算 ============
// マスター報酬：その職業のメイン能力×1.2（無職は全能力×1.1）／修練場1000回：メイン能力×2（無職・見習い？は全能力×1.5）
function jobBonus(k){ let m=1; for(const [jk,j] of Object.entries(JOBS)){
    const all=j.main==='best';
    if(isMaster(jk)) m*= all?1.1:(j.main===k?1.2:1);
    if(P.kiwami&&P.kiwami[jk]) m*= (all||j.hidden)?1.5:(j.main===k?2:1);
  } return m; }
let _jbCache=null, _jbKey='';
const jobBonusC=k=>{ const key=JSON.stringify([P.jlv,P.kiwami]); if(key!==_jbKey){_jbKey=key;_jbCache={};} return _jbCache[k]??(_jbCache[k]=jobBonus(k)); };
// 伝説の装飾品（無職専用・装備枠とは別に、持っていれば無職のとき自動で効く）
const LACC=[
 // 価格nullは店では買えず、ハローワークの関門突破で手に入る（floor=その関門を越えたら）
 ['tie','勝負ネクタイ',null,'ハローワークの社会的信用×2',3,'ハローワークで、ある関門を越えた者に贈られるらしい…'],
 ['glasses','知的なメガネ',null,'言葉に詰まらなくなる・圧縮ダメージ×1.5',6,'ハローワークで、さらに先の関門を越えた者に贈られるらしい…'],
 ['watch','高級腕時計',1e80,'ハローワークの1戦が15ターンに'],
 ['shoes','磨かれた革靴',1e120,'全能力×10'],
];
const hasL=k=>P.job==='neet'&&!!(P.lacc&&P.lacc[k]);
function grantLacc(L){ const w=P.work; if(!w) return; const fl=w.cleared?99:w.floor; LACC.forEach(a=>{ if(a[4]&&fl>=a[4]&&!(P.lacc&&P.lacc[a[0]])){ P.lacc=P.lacc||{}; P.lacc[a[0]]=true; if(L) L.push(`<span class="mir">★ 伝説の装飾品「${a[1]}」を贈られた！（${a[3]}） ★</span>`); } }); }
function buyLacc(k){ const a=LACC.find(x=>x[0]===k); if(!a||a[2]===null||P.job!=='neet'||(P.lacc&&P.lacc[k])||P.gold<a[2]) return; P.gold-=a[2]; P.lacc=P.lacc||{}; P.lacc[k]=true; save(); renderStatus(); panel('acc'); }
const st=k=>P.base[k]*P.rebMul*masterMul()*accStat(k)*jobBonusC(k)*(hasL('shoes')?10:1);
const RMUL=[1,3,10,10]; const rmul=()=>RMUL[JOBS[P.job].rank];
// +99（20種＋99段＝119段目）に到達すると伝説の装備に置き換わる
const GEAR_MAX=119;
const LEG_W='桁あふれの剣 オーバーフロー', LEG_A='桁あふれの鎧 アンダーフロー';
const legW=()=>P.wpn>=GEAR_MAX, legA=()=>P.arm>=GEAR_MAX;
const wpnPow=w=>w>=GEAR_MAX?12*Math.pow(5,GEAR_MAX)*1e4:w?12*Math.pow(5,w):0;
const armPow=a=>a>=GEAR_MAX?6*Math.pow(5,GEAR_MAX)*1e4:a?6*Math.pow(5,a):0;
const wpnPrice=w=>100*Math.pow(7,w);
const armPrice=a=>80*Math.pow(7,a);
const itemName=(list,i)=>i<=0?'なし':i>=GEAR_MAX?(list===WPN?LEG_W:LEG_A):(i<=list.length?list[i-1]:list[list.length-1]+'+'+(i-list.length));
function atk(){return (st(mainKey())+wpnPow(P.wpn))*(1+P.lv*0.08)*(1+0.05*(jl(P.job).lv-1))*rmul()}
function def(){return (st('vit')*0.5+armPow(P.arm))*rmul()}
function maxhp(){return Math.floor((st('vit')*12+P.lv*10*P.rebMul+armPow(P.arm)*3)*rmul())}
const need=lv=>Math.floor(15*Math.pow(1.3,lv-1));
const rebReq=()=>30+20*P.reb;
function enemyStats(t){return {hp:30*Math.pow(5.5,t),atk:10*Math.pow(5.2,t),def:4*Math.pow(5,t),agi:6+t*9,exp:12*Math.pow(4.3,t),gold:25*Math.pow(6,t)}}
const AREA_MAX=12+299; // 次元の彼方 第300層が最終
const areaName=t=>t<AREAS.length?AREAS[t][0]:t>=AREA_MAX?'次元の果て（第300層）':`次元の彼方 第${t-AREAS.length+1}層`;
const AREA_WINS=10;
const areaLv=t=>Math.max(1,Math.round(1+t*5.6));
function makeEnemy(t){
  const a=AREAS[t%AREAS.length]; const i=Math.floor(Math.random()*3); const [nm,sp]=a[1][i];
  const name=t<AREAS.length?nm:t>=AREA_MAX?`次元の果ての${nm}`:`第${t-AREAS.length+1}次元の${nm}`;
  return Object.assign(enemyStats(t+i*0.15),{name,sp,hue:(t*47+i*30)%360});
}
const champName=k=>k<CHAMPS.length?CHAMPS[k]:`${k-CHAMPS.length+2}代目 無限王`;
const CHAMP_MAX=300, GOD_TIER_MAX=330; // これ以上は数値があふれるので頭打ち
function makeChamp(k){ k=Math.min(k,CHAMP_MAX-1);
  const s=enemyStats(0.8+k*1.25); s.hp*=4; s.atk*=1.3; s.def*=1.3; s.gold*=10;
  const rl=areaLv(0.8+k*1.25); s.exp=need(rl)*(Math.pow(1.3,5)-1)/0.3; // 推奨Lvの人が+5Lv上がる量
  return Object.assign(s,{name:champName(k),sp:'knight',hue:(k*67+20)%360,champ:true,lv:areaLv(0.8+k*1.25)});
}
function makeSecret(){
  const s=enemyStats(Math.min(GOD_TIER_MAX,14+(P?P.reb:0)*3)); s.hp*=5; s.atk*=2; s.def*=2; s.exp*=3; s.gold*=3;
  const r=P?P.reb:0; return Object.assign(s,{name:r?`創世神竜 アルケイオン・第${r+1}形態`:'創世神竜 アルケイオン',sp:'dragon',hue:(45+r*60)%360,secret:true});
}
// 危険度：自分が倒すまでのターン数と、倒されるまでのターン数の比
function danger(e){
  const pa=atk()*1.5, ea=e.atk*1.5*ps('taken',1);
  const pd=Math.max(pa-e.def*.5,pa*.08,1), ed=Math.max(ea-def()*.5,ea*.08,1);
  const r=(maxhp()/ed)/(e.hp/pd);
  if(r>=5) return '<span class="g">楽勝</span>';
  if(r>=1.5) return '<span class="c">適正</span>';
  if(r>=.6) return '<span class="o">強敵</span>';
  return '<span class="r">無謀</span>';
}

  const b=betAmt(); lastAllIn=b>0&&b===P.gold; if(b<1){casMsg='<span class="r">賭けるお金がない！</span>'; return 0;} P.gold-=b; return b; }
function settle(bet,mult,txt){ const ret=payout(bet,mult); P.gold+=ret; if(ret>bet){P.earned=(P.earned||0)+ret-bet; if(lastAllIn) P.allInWins=(P.allInWins||0)+1;} if(P.gold===1) P.oneG=true;
  casMsg = mult>0 ? `${txt} <span class="g">+${fmt(ret-bet)}G</span>` : `${txt} <span class="r">-${fmt(bet)}G</span>`;

  drawSprite($('#cvP'),'knight',JOBS[P.job].hue,false); $('#nmP').textContent=`${P.name} Lv${P.lv}`;
  drawSprite($('#cvE'),e.sp,e.hue,true); $('#nmE').textContent=e.name;
  const lk=locOf(e,t); if(lk!==locKey){locKey=lk; locRun=0;}
  let R;
  try{ R=e.work?simulateWork(e,fast):simulate(e,t,fast); }
  catch(err){ holdEnd(); $('#result').innerHTML=`<span class="r">エラーが起きました：${esc(err&&err.message||err)}</span><div class="small">「戻る」で戻れます。この文面を教えてもらえれば直します。</div>`; $('#log').innerHTML=''; return; }
  const {L,sum,newArea,trainMile}=R;
  locRun++; P.locB=P.locB||{}; P.locB[lk]=(P.locB[lk]||0)+1;
  $('#result').dataset.win=(sum.includes('勝利')||sum.includes('突破'))?'1':'0';
  if(e.work){ const w=workState(); $('#nmE').textContent=w.cleared?'内定':WORK[w.floor].n; drawSprite($('#cvE'),WORK[w.floor].sp,WORK[w.floor].hue,true); }
  $('#nmP').textContent=`${P.name} Lv${P.lv}`;
  $('#result').innerHTML=sum+`<div class="small">所持金 ${fmt(P.gold)}G　<span class="c">${locName(lk)}：今回${fmt(locRun)}戦目（累計${fmt(P.locB[lk])}戦）</span></div><div class="small">${JOBS[P.job].n}での戦闘 ${fmt((P.jobB||{})[P.job]||0)}回　総戦闘${fmt(P.battles)}回</div>`;
  const box=$('#log'); box.innerHTML=L.map(x=>`<p>${x}</p>`).join(''); box.scrollTop=box.scrollHeight;
  if(newArea!==undefined && t>=0){ holdEnd(); showAreaModal(newArea); }
  if(trainMile){ holdEnd(); }
}
function showAreaModal(na){
  $('#mTitle').innerHTML=`<span class="mir">新エリア解放！</span>`;
  const e=enemyStats(na);
  $('#mBody').innerHTML=`「<span class="y">${areaName(na)}</span>」へ行けるようになった。<br>目安Lv${areaLv(na)} / 危険度 ${danger(e)}<br><br>次のエリアに進む？ それともここで鍛える？`;
  $('#mGo').onclick=()=>{ $('#modal').classList.add('hide'); last={type:'area',t:na}; fightArea(na); };
  $('#mStay').onclick=()=>{ $('#modal').classList.add('hide'); };
  $('#modal').classList.remove('hide');
}
function closeModal(){ $('#modal').classList.add('hide'); }

// ============ 起動 ============
load(); renderTitle(); show('sTitle'); $('#inName').addEventListener('input',nameHint);
</script>
