async function parseCode(t){ t=(t||'').replace(/\s+/g,''); let o;

const WTYPE_LIST=Object.keys(WTYPES);
// 職業の得意な武器（合っていると物理ダメージ×1.5）。魔法職は魔法で戦うので得意な武器なし
const JOB_WT={adventurer:'剣',apprentice:'剣',warrior:'剣',thief:'小剣',gambler:'小剣',fighter:'体術',hunter:'弓',knight:'剣',dancer:'小剣',merchant:'棍棒',
  berserker:'斧',ninja:'小剣',shark:'小剣',kenou:'体術',sniper:'弓',paladin:'大剣',maiden:'小剣',tycoon:'棍棒',
  hero:'剣',spellblade:'剣',assassin:'小剣',swordsaint:'大剣',dragoon:'槍',phantom:'小剣',luckking:'斧',overlord:'体術',neet:'体術',
  mage:'杖',priest:'杖',bard:'杖',alchemist:'杖',archmage:'杖',bishop:'杖',maestro:'杖',grandalch:'杖',sage:'杖',tennyo:'杖',chrono:'杖',saint:'杖'};
// 職業の属性はなくした（#74）。攻撃の属性は武器だけで決まる
const isMagicJob=k=>JOBS[k]&&JOBS[k].main==='int';
// 武器・防具の名前どおりの属性（1段目から。21段目以降は最後の名前と同じ＝無）
const WPN_EL=['無','無','無','無','無','無','火','水','風','土','光','闇','光','風','水','闇','土','闇','光','無'];
const ARM_EL=['無','無','無','無','無','無','無','火','水','土','光','闇','光','風','水','闇','土','闇','光','無'];
const gearDefEl=(isW,i)=>i<=0||i>=GEAR_MAX?'無':(isW?WPN_EL:ARM_EL)[Math.min(i,20)-1];
const myWType=()=>neetW()?'体術':(P.wType||JOB_WT[P.job]||(P.wpn===1?'棍棒':'剣'));
const myAtkEl=()=>{ if(neetW()) return '無'; const w=P.wEl||gearDefEl(true,P.wpn); return w; };
const myArmEl=()=>P.aEl||gearDefEl(false,P.arm);
// 得意な武器：物理職はその武器の種類、魔法職は杖（魔法剣士は剣でも杖でも）
const prefMul=()=>{ const w=myWType(); if(P.job==='spellblade'&&(w==='剣'||w==='杖')) return 1.5; return JOB_WT[P.job]&&JOB_WT[P.job]===w?1.5:1; };

// 敵の系統ごとの効きやすさ（書いていない種類は×1）
// 斬・突・射・打の相性はなくした（#62）。武器の種類は、得意武器の補正と合成の素材だけに使う
const SP_RES={};
const SP_MDEF={slime:.8,bat:.6,eye:1.5,skull:.3,dragon:1.5,knight:1};
// 効かない敵：物理が効かない（魔法でしか倒せない）／魔法が効かない（物理でしか倒せない）
// 通常のダンジョン（最初の12エリア・次元の彼方）では使わない（#74）。エンドコンテンツ（#63）で敵に e.res='phys'／'魔' を付けると効く
const IMMUNE={};
const magicAttacker=e=>e.sp==='eye'||e.base==='坑道の亡霊'||e.base==='船幽霊'||resKind(e)==='phys';
// 敵に属性・MDEFなどを付ける（makeEnemy などから呼ぶ）。flat：最後の敵（相性はすべて等倍）
function elemize(e,el,flat){ e.el=el; e.flat=!!flat; if(e.mdef===undefined) e.mdef=(e.def||0)*(SP_MDEF[e.sp]||1); return e; }
// 物理に強い／魔法に強い（#62 #69）：効かない（×0）はなくし、効きにくい（×0.5）だけ
// 最初の12エリアは敵ごと（坑道の亡霊・船幽霊は物理に強い、鉱石スライムは魔法に強い）、次元の彼方は層ごとに決まる
const RES_MUL=.5;
function resKind(e){ if(e.flat) return null; return e.res||IMMUNE[e.base]||null; }
const tendName=k=>k==='phys'?'物理に強い':k==='魔'?'魔法に強い':'';
function typeMul(at,e){ const k=resKind(e); if(!k) return 1; return (k==='魔')===(at==='魔')?RES_MUL:1; }

// MATK・MDEF（#27）
function matk(){ return capN((wpnPow(P.wpn)*.5+10)*P.rebMul*coefK('int')*(1+lvB()*0.08)*(1+0.05*(jl(P.job).lv-1))*rmul()*neetWAtk()*matMul('atk')); }
function mdef(){ return capN((armPow(P.arm)*.5+5)*P.rebMul*(coefK('int')+coefK('vit'))/2*rmul()*matMul('def')); }
// この敵にどう攻撃するか：攻撃の種類・相性の倍率・元のATK・敵の防御（魔法剣士は効くほうを選ぶ）
function attackPlan(e){
  const el=myAtkEl(), em=e.flat?1:elMul(el,e.el);
  const pm=prefMul(), w=myWType(), phys={at:WTYPES[w],base:atk()*(isMagicJob(P.job)?1:pm),edef:e.def||0}, mag={at:'魔',base:matk()*(w==='杖'?pm:1),edef:e.mdef!==undefined?e.mdef:(e.def||0)};
  const opts=P.job==='spellblade'?[phys,mag]:isMagicJob(P.job)?[mag]:[phys];
  let best=null; for(const o of opts){ o.aff=em*typeMul(o.at,e); o.el=el; o.score=o.aff*Math.max(o.base-o.edef*.5,o.base*.08); if(!best||o.score>best.score) best=o; }
  return best; }
function defensePlan(e){ const magic=magicAttacker(e); return {magic,mul:e.flat?1:elMul(e.el,myArmEl()),d:magic?mdef():def()}; }
const affWord=m=>m===0?'<span class="r">効かない！</span>':m>=5?'<span class="g">効果はばつぐんだ！</span>':m>1?'<span class="g">よく効く</span>':m<=.2?'<span class="r">いまひとつのようだ…</span>':m<1?'<span class="o">効きが悪い</span>':'';
const atName=at=>at==='魔'?'魔法':at;

// 職業ごとの能力の補正（％）：成長率の高い能力ほど上がり、低い能力ほど下がる。下位±30%・中位±60%・上位±100%（見習い？・無職はなし）
const JOB_MOD_R=[.3,.6,1];
function jobMod(k){ const J=JOBS[P.job]; if(!J||J.hidden||J.main==='best') return 1; const g=J.g, mean=KEYS.reduce((a,x)=>a+g[x],0)/KEYS.length;
  const dev=Math.max(-1,Math.min(1,(g[k]-mean)/mean*2)); return Math.max(.1,1+JOB_MOD_R[J.rank]*dev); }
function jobModText(k0){ const J=JOBS[k0]; if(!J||J.hidden||J.main==='best') return ''; const save=P.job; P.job=k0;
  const t=KEYS.map(k=>{ const m=jobMod(k); const p=Math.round((m-1)*100); return p?`${KN[k]}${p>0?'+':''}${p}%`:''; }).filter(Boolean).join('・'); P.job=save; return t; }

// 属性・武器の種類の付け直し（武器屋・防具屋）：値段は forgePrice。無職の武器（辞表）は無属性から変えられない
// 付け直しの値段（#60）：次元の彼方に入るまでは無料、そのあとは最深エリアの敵のお金×5戦分
const forgePrice=isW=>P.forgeFree||P.maxArea<AREAS.length?0:Math.floor(goldBase()*5);
function forgeEl(isW,el){ if(!ELS.includes(el)) return; if(isW&&neetW()) return; if(isW?!P.wpn:!P.arm) return; const pr=forgePrice(isW); if(P.gold<pr) return;
  P.gold-=pr; P.forgeFree=false; if(isW) P.wEl=el; else P.aEl=el; save(); renderStatus(); panel(isW?'wpn':'arm'); }
function forgeType(t){ if(!WTYPES[t]||neetW()||!P.wpn) return; const pr=forgePrice(true); if(P.gold<pr) return; P.gold-=pr; P.forgeFree=false; P.wType=t; save(); renderStatus(); panel('wpn'); }
// 属性のお知らせ（森）を見るまでは、付け直しも属性の表示も出さない（#47）
const elemOpen=()=>!!(P.pops&&P.pops.elem)||P.maxArea>=1;
function forgeHTML(isW){ if(!elemOpen()) return '';
  const cur=isW?P.wpn:P.arm; if(!cur) return '';
  const pr=forgePrice(isW), el=isW?(neetW()?'無':(P.wEl||gearDefEl(true,P.wpn))):myArmEl();
  let h=`<div class="win" style="margin:6px 0;padding:6px 8px"><div class="small y">属性の付け直し（${P.forgeFree?'<span class="g">次の1回は無料（精霊の酒）</span>':(pr?fmt(pr)+'G＝最深エリアの敵のお金×5戦分':'<span class="g">無料（次元の彼方に入るまで）</span>')}）</div><div class="small">今の属性：</div>`;
  if(isW&&neetW()) h+=`<div class="small o">${NEET_W}は無属性から変えられない。</div>`;
  else h+=`<div class="grid" style="grid-template-columns:repeat(7,1fr);margin-top:4px">`+ELS.map(x=>`<button style="font-size:12px;padding:5px 0;color:${EL_COLOR[x]}" ${x===el||P.gold<pr?'disabled':''} onclick="forgeEl(${isW},'${x}')">${x}</button>`).join('')+`</div>`;
  if(isW){ h+=`<div class="small y" style="margin-top:6px">武器の種類（${fmt(pr)}G）：今は ${myWType()}（${atName(WTYPES[myWType()])}）${prefMul()>1?' <span class="g">得意な武器×1.5</span>':JOB_WT[P.job]?` <span class="small">（${JOBS[P.job].n}の得意は${JOB_WT[P.job]}）</span>`:''}</div>`;
    if(neetW()) h+=`<div class="small o">${NEET_W}は叩きつける（体術・打）。変えられない。</div>`;
    else h+=`<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:4px">`+WTYPE_LIST.map(t=>`<button style="font-size:12px;padding:5px 0" ${t===myWType()||P.gold<pr?'disabled':''} onclick="forgeType('${t}')">${t}<span class="small">（${WTYPES[t]}）</span></button>`).join('')+`</div>`;
    if(isMagicJob(P.job)) h+=`<div class="small c">${JOBS[P.job].n}は魔法で戦う（MATKはINTと武器で決まる）。杖を持つと魔法×1.5。武器の属性は乗る。</div>`; }
  return h+`</div>`; }

// エリアの一覧の相性表示（#28）
function areaMatch(t){ const el=areaEl(t), sp=AREAS[t%AREAS.length][1];
  const fake=sp.map(([nm,s])=>elemize({def:1,sp:s,base:nm,t},el,false));
  const plans=fake.map(attackPlan);
  const emul=elMul(myAtkEl(),el), dm=elMul(el,myArmEl());
  const mark=emul>=5?'<span class="g">◎ 有利（×5）</span>':emul<1?`<span class="o">△ 不利（×${emul}）</span>`:'<span class="small">○ 普通</span>';
  const al=areaAils(t), ailT=al.length?` <span class="r">状態異常：${ailNames(al)}</span>`:'';
  const tk=fake.map(resKind).find(Boolean), imm=tk?` <span class="o">${t>=AREAS.length?'この層は':'効きにくい敵：'}${tendName(tk)}</span>`:'';
  const def=dm>=5?' <span class="r">守り△（受けるダメージ×5）</span>':dm<1?` <span class="g">守り◎（×${dm}）</span>`:'';
  return {el,html:`属性 ${elTag(el)}　${mark}${def}${imm}${ailT}`}; }

// ============ 武器・防具の名前（#31）：段の名前＋種類の名前 ============
// 段の名前（20段）。kata：カタカナの名前と組み合わせる段、one：1字でつなげる段（聖剣・魔斧・神杖）
const TIER_N=['木','銅','鉄','鋼','銀','ミスリル','炎','氷','雷鳴','ドラゴン','聖','魔','神','星','銀河','宇宙','次元','虚無','創世','インフレ'];
const TIER_KATA=new Set(['ミスリル','ドラゴン','インフレ']), TIER_ONE=new Set(['聖','魔','神']);
// 種類ごとの名前：[ふつう, カタカナ, 1字つなぎ]
const WNOUN={剣:['剣','ソード','剣'],大剣:['大剣','グレートソード','大剣'],斧:['斧','アックス','斧'],小剣:['短剣','ダガー','短剣'],槍:['槍','スピア','槍'],
  弓:['弓','ボウ','弓'],棍棒:['棍棒','メイス','棍'],体術:['籠手','ナックル','拳'],杖:['杖','ロッド','杖']};
// 防具の型：魔法職はローブ、AGIが得意な職業は軽装、それ以外は鎧
const ANOUN={鎧:['鎧','アーマー','鎧'],軽装:['胸当て','ベスト','衣'],ローブ:['ローブ','ローブ','法衣']};
const armStyle=()=>isMagicJob(P.job)?'ローブ':(JOBS[P.job]&&JOBS[P.job].main==='agi')?'軽装':'鎧';
function tierName(i,noun){ const p=TIER_N[Math.min(i,20)-1];
  if(TIER_KATA.has(p)) return p+noun[1]; if(TIER_ONE.has(p)) return p+noun[2]; return p+'の'+noun[0]; }
function wName(i,type){ type=type||myWType(); const n=WNOUN[type]||WNOUN.剣;
  if(i<=0) return 'なし'; if(i>=GEAR_MAX) return `桁あふれの${n[0]} オーバーフロー`;
  if(i===1&&type==='棍棒') return 'こんぼう';
  return tierName(i,n)+(i>20?'+'+(i-20):''); }
function aName(i,style){ style=style||armStyle(); const n=ANOUN[style]||ANOUN.鎧;
  if(i<=0) return 'なし'; if(i>=GEAR_MAX) return `桁あふれの${n[0]} アンダーフロー`;
  if(i===1) return style==='ローブ'?'布のローブ':style==='軽装'?'布の服':'布の服';
  return tierName(i,n)+(i>20?'+'+(i-20):''); }
// ============ 能力と効き目の計算（#43 #9 #72） ============
// 能力ポイントは基礎値に足さず、能力ごとに数える（P.alloc）。その能力に ×(1＋振った数÷100)²
// 限界突破（P.limitBreak）の前は、1つの能力につき PT_CAP まで
const PT_CAP=1e4, PT_BONUS_MIN=1000, PT_PER_LV=4; // 1レベルで4pt（能力が6つになったので）
const limitOn=()=>!!(P&&P.limitBreak);
const allocN=k=>(P.alloc&&P.alloc[k])||0;
const allocSum=()=>KEYS.reduce((a,k)=>a+allocN(k),0);
// 振り方のボーナス：合計 PT_BONUS_MIN 以上振ってから。極振り＝1つに6割以上、万能＝6つとも12%以上
function allocStyle(){ const s=allocSum(); if(s<PT_BONUS_MIN) return {}; const top=KEYS.find(k=>allocN(k)/s>=.6);
  if(top) return {extreme:top}; if(KEYS.every(k=>allocN(k)/s>=.12)) return {allround:true}; return {}; }
const ptMul=k=>{ const n=limitOn()?allocN(k):Math.min(PT_CAP,allocN(k)); return Math.pow(1+n/100,2)*(allocStyle().allround?1.5:1); };
const ptCapped=k=>!limitOn()&&allocN(k)>=PT_CAP;
// 配分ボーナス：x＝その能力÷6つの平均、効き目＝最大×x²/(x²+1)（均等で半分）
// 6つの能力の割合（あふれないよう、足す前に÷6する）。能力が変わらない間は計算し直さない
let _shKey='', _sh=null;
function shareAll(){ const key=KEYS.map(k=>P.base[k]+':'+allocN(k)).join(',')+'|'+P.job+'|'+P.lv+'|'+JSON.stringify(P.accEq||[])+'|'+(P.dk||[]).length+'|'+(P.kiwami?Object.keys(P.kiwami).length:0)+'|'+masterCount();
  if(key===_shKey&&_sh) return _sh; const v={}; KEYS.forEach(k=>v[k]=Math.min(Number.MAX_VALUE,stB(k)||0)); const avg=KEYS.reduce((a,k)=>a+v[k]/KEYS.length,0); _sh={}; KEYS.forEach(k=>_sh[k]=avg>0?v[k]/avg:1); _shKey=key; return _sh; }
const shareOf=k=>shareAll()[k];
const shapeX=x=>x*x/(x*x+1);
function abBonus(k,max){ const s=allocStyle(); return max*shapeX(shareOf(k))*(s.allround?1.2:1)*(s.extreme===k?1.5:1); }
// LUK
const critRate=()=>Math.min(1,.1*(1+abBonus('luk',limitOn()?3:2))+ps('crit',0));
const mirRate=()=>.004*(1+abBonus('luk',1))+(P.blessed&&P.blessed[P.job]?.12:0)+accMir()+drinkMul('mir');
const fruitRate=()=>.04+abBonus('luk',.16);
const skillRate=()=>Math.min(.9,JOBS[P.job].skill.p+abBonus('luk',.1)+(jl(P.job).lv-1)*.01);
// AGI：敵との「速さの比」r（1で互角）。いちばん奥のエリア（と番人）の敵と互角、そこより浅い敵ほど遅い（1エリアで約1.4倍）
// AGIの配分で ×0.75〜×1.25（振らなくても大きくは外さない）。e.spd は敵の速さ係数（桁の神の第4形態以降など）
const SPD_STEP=.1;
const agiG=()=>.75+.5*shapeX(shareOf('agi'));
function spdRatio(e){ const d=e.t!==undefined?e.t:e.gt; let p=1;
  if(d!==undefined&&d>=0&&d!==P.maxArea){ const a=enemyStats(P.maxArea), b=enemyStats(d); p=Math.pow((a.atk*a.hp)/(b.atk*b.hp),SPD_STEP); }
  return Math.max(.05,Math.min(20,agiG()*Math.min(5,Math.max(.2,p))/(e.spd||1))); }
const lerpT=(x,T)=>{ if(x<=T[0][0]) return T[0][1]; for(let i=1;i<T.length;i++) if(x<=T[i][0]){ const [a,va]=T[i-1],[b,vb]=T[i]; return va+(vb-va)*(x-a)/(b-a); } return T[T.length-1][1]; };
// こちらの回避：比 0.5で0%／1で10%／1.5で30%／2で50%／3で90%
const EVA_T=[[.5,0],[1,.1],[1.5,.3],[2,.5],[3,.9]];
const evaRate=r=>Math.min(1,lerpT(r,EVA_T)+ps('eva',0));
// こちらの命中：命中値−敵の回避値（互角で5%、敵が2倍速いと50%）（5〜100%）。命中値＝85%＋DEXの配分 最大+30%＋転生1回+0.5%（最大+100%）。上限 200%（限界突破で255%）
// 限界突破のあとは、DEXに振ったポイントでさらに伸びる（10万ptで+40%）
const hitVal=()=>Math.min(limitOn()?2.55:2,.85+abBonus('dex',.3)+Math.min(1,(P.reb||0)*.005)+(limitOn()?Math.min(.4,allocN('dex')/1e5*.4):0));
const EEVA_T=[[1,.05],[1.5,.25],[2,.5],[3,1],[5,1.5]];
const hitRate=r=>Math.max(.05,Math.min(1,hitVal()-lerpT(1/r,EEVA_T)));
// 先制攻撃（はじめにただで1回攻撃）10〜50%、先制の鈴で+10〜15%（最大65%）。バックアタック3〜12%（鈴で-2%）
const bellB=()=>accT('first')>0?Math.min(.15,.1+.01*accT('first')):0;
const firstRate=r=>Math.min(.65,lerpT(r,[[.5,.1],[3,.5]])+bellB());
const backRate=r=>Math.max(.01,lerpT(r,[[.5,.12],[3,.03]])-(accT('first')>0?.02:0));

// 限界突破：桁の神の第3形態を倒すと開く。★5を6系統×10個
const LB_FORM=3, LB_COST=10;
const lbOpen=()=>!!(P.final&&(P.final.best||0)>=LB_FORM);
const lbReady=()=>GM_SP.every(g=>gmN(g.sp+'_s5')>=LB_COST);
function limitBreak(){ if(limitOn()||!lbOpen()||!lbReady()) return; GM_SP.forEach(g=>{ P.gm[g.sp+'_s5']-=LB_COST; }); P.limitBreak=true; save(); renderStatus(); panel('reb');
  showPopup({title:'<span class="mir">★ 限界突破 ★</span>',body:`<div class="small">${esc(P.name)}は、限界を越えた！<br><br>・能力ポイントの上限がなくなった<br>・命中の上限が255%に<br>・会心のLUKボーナスが最大+300%に<br><br>桁の神の第${LB_FORM+1}形態からは、敵の速さもさらに増していく。</div>`}); }
function lbHTML(){ if(limitOn()) return `<div class="small mir" style="margin-top:8px">★ 限界突破済み ★</div>`; if(!lbOpen()) return '';
  return `<div class="win" style="margin-top:8px;padding:6px 8px"><div class="y">限界突破</div><div class="small">能力ポイント・命中・会心の上限を外す。★5の素材を6系統それぞれ${LB_COST}個ささげる。</div>`+
    `<div class="small">`+GM_SP.map(g=>`${g.n} ${Math.min(gmN(g.sp+'_s5'),LB_COST)}/${LB_COST}`).join('・')+`</div><button style="width:100%;margin-top:4px" ${lbReady()?'':'disabled'} onclick="limitBreak()">限界突破する</button></div>`; }
// ステータス欄の命中・回避・会心（いちばん奥のエリアの敵が相手）
function battleRatesHTML(){ const r=spdRatio({t:P.maxArea}), pc=x=>Math.round(x*100)+'%';
  return `<div class="small">命中 ${pc(hitRate(r))}・回避 ${pc(evaRate(r))}・会心 ${pc(critRate())} <span style="color:#9ab">（${areaName(P.maxArea)}の敵に）</span></div>`; }
// ============ 冒険：固有ドロップ・図鑑・番人（#8） ============
// 固有品：エリアの系統（12種。次元の彼方も同じ系統をくり返す）ごとに1つ。1個ごとに対応する値が×1.01（複利・最大999個）
const MATS=[
  {n:'四つ葉のクローバー',k:'luk',t:'LUK'},{n:'森のどんぐり',k:'exp',t:'経験値'},{n:'古代の鉱石',k:'atk',t:'ATK'},
  {n:'砂漠の砂時計',k:'agi',t:'AGI'},{n:'溶けない氷',k:'def',t:'DEF'},{n:'火竜のうろこ',k:'str',t:'STR'},
  {n:'幽霊船の羅針盤',k:'dex',t:'DEX'},{n:'天使の羽根',k:'hp',t:'最大HP'},{n:'魔界の角',k:'int',t:'INT'},
  {n:'混沌のかけら',k:'drop',t:'能力の実の出やすさ'},{n:'虚無の砂',k:'vit',t:'VIT'},{n:'時の歯車',k:'jexp',t:'熟練度'}];
const MAT_MAX=999, MAT_RATE=.03;
const matN=i=>(P&&P.mats&&P.mats[i])||0;
const matMul=k=>{ const i=MATS.findIndex(m=>m.k===k); return i<0?1:Math.pow(1.01,matN(i)); };
function matDrop(t,L,n=1){ const i=t%AREAS.length; P.mats=P.mats||{}; const a=matN(i); if(a>=MAT_MAX) return '';
  P.mats[i]=Math.min(MAT_MAX,a+n); const M=MATS[i];
  L.push(`<span class="mir">★ 固有品「${M.n}」を${n>1?n+'個':''}手に入れた！（${P.mats[i]}個：${M.t}×${fmtMul(matMul(M.k))}）</span>`);
  return `${M.n}${n>1?'×'+n:''}`; }
// 図鑑：系統ごとの3種（36種）。倒した数と、出会った一番深い層を記録する
const bkKey=(a,i)=>`${a}_${i}`;
function bkCount(e,t){ if(!e.bk) return; P.bk=P.bk||{}; P.bkT=P.bkT||{}; P.bk[e.bk]=(P.bk[e.bk]||0)+1; P.bkT[e.bk]=Math.max(P.bkT[e.bk]||0,t); }
const bkFound=()=>Object.keys(P.bk||{}).filter(k=>P.bk[k]>0).length;
// 番人：次元の彼方の10層ごと（第10層〜第300層の30体）。最深の番人の層では、10勝したあと番人を倒さないと先へ進めない
const layerOf=t=>t-AREAS.length+1;
const isGuardT=t=>t>=AREAS.length&&layerOf(t)%10===0;
const GUARD_T=[]; for(let t=AREAS.length;t<=AREA_MAX;t++) if(isGuardT(t)) GUARD_T.push(t);
const guardBeaten=t=>!!(P.guard&&P.guard[layerOf(t)]);
const guardBlock=()=>isGuardT(P.maxArea)&&!guardBeaten(P.maxArea)&&!P.areaDone;
const GUARD_TITLE=['門番','守護者','番兵','鎮守','墓守','監視者','裁定者','執行者','守り手','封印者'];
function makeGuard(t){ const n=layerOf(t), a=AREAS[t%AREAS.length], i=(n/10)%3, [nm,sp]=a[1][i];
  const s=enemyStats(t+.35); s.hp*=18; s.atk*=1.8; s.def*=1.4; s.exp*=40; s.gold*=60;
  return elemize(Object.assign(s,{name:`第${n}層の${GUARD_TITLE[(n/10-1)%GUARD_TITLE.length]} ${nm}`,base:nm,sp,hue:(t*47+i*30+180)%360,guard:true,gt:t,bk:bkKey(t%AREAS.length,i)}),t>=AREA_MAX?'無':areaEl(t),t>=AREA_MAX); }
function canGuard(t){ return isGuardT(t)&&!guardBeaten(t)&&(t<P.maxArea||(t===P.maxArea&&P.areaWins>=AREA_WINS)||(t===P.maxArea&&P.areaDone)); }
function fightGuard(t,f){ if(takashiLock()||!canGuard(t)) return; last={type:'guard',t}; runBattle(makeGuard(t),-6,f); }
// 番人を倒したとき
function guardWin(e,L,c){ const t=e.gt, n=layerOf(t); P.guard=P.guard||{}; P.guard[n]=true;
  L.push(`<span class="mir">★ ${e.name}を討ち取った！ ★</span>`);
  matDrop(t,L,10); gmGuardBonus(e,L);
  if(t===P.maxArea&&!P.areaDone&&P.areaWins>=AREA_WINS){
    if(P.maxArea>=AREA_MAX){ P.areaDone=true; c.trainMile=true;
      L.push(`<span class="mir">★★★ 次元の果てを踏破した！ ★★★</span>`); grantNeetGear(L); L.push(`<span class="mir">これより先に、世界は存在しない。</span>`); }
    else { P.maxArea++; P.areaWins=0; c.newArea=P.maxArea; L.push(`<span class="y">道が開けた！ 新エリア「${areaName(P.maxArea)}」が解放された！</span>`); }
  }
  c.trainMile=true; }
// 図鑑：その敵を10回倒すと、弱点・耐性が見える（番人は1回）
function weakHTML(nm,sp,show){ if(!show) return '<span style="color:#789">弱点：あと少し戦えばわかりそう（10回倒すと見える）</span>';
  const im=IMMUNE[nm];
  return `${im?`<span class="o">${tendName(im)}（×${RES_MUL}）</span>`:'<span class="g">物理・魔法とも普通</span>'}`; }
// 図鑑の画面
function bookHTML(){
  const pic=(a,i,seen)=>{ const src=typeof PIX!=='undefined'&&PIX.z&&typeof PIX_AREA!=='undefined'?PIX.z[PIX_AREA[a][i]]:''; return src?`<img src="${src}" style="width:36px;height:36px;image-rendering:pixelated;${seen?'':'filter:brightness(0) opacity(.5)'}">`:''; };
  const g=Object.keys(P.guard||{}).length;
  let h=`<div class="small">図鑑 <span class="y">${bkFound()}/${AREAS.length*3}種</span>　番人 <span class="y">${g}/${GUARD_T.length}体</span>　固有品 <span class="y">${MATS.filter((m,i)=>matN(i)>0).length}/${MATS.length}種</span></div>`;
  h+=`<div class="small" style="color:#9ab;margin:2px 0 6px">固有品は、その系統のエリア（次元の彼方の同じ系統の層でも）で敵を倒すと${Math.round(MAT_RATE*100)}%で手に入る。1個ごとに効果×1.01（複利・最大${MAT_MAX}個）。番人を倒すと10個。</div>`;
  AREAS.forEach((A,a)=>{ const M=MATS[a], m=matN(a), seenArea=a<=P.maxArea;
    const found=A[1].filter((x,i)=>(P.bk&&P.bk[bkKey(a,i)])>0).length;
    h+=`<details class="win" style="margin:6px 0;padding:6px 8px;border-left:4px solid ${EL_COLOR[areaEl(a)]}"><summary><span class="y">${seenArea?A[0]+' '+elTag(areaEl(a)):'？？？'}</span> <span class="small">${found}/3種${m?'・'+MATS[a].n+' '+m+'個':''}</span></summary>`;
    h+=`<div class="small">${m?`<span class="mir">${M.n}</span> ${m}個：${M.t}×${fmtMul(matMul(M.k))}${m>=MAT_MAX?' <span class="y">MAX</span>':''}`:`<span style="color:#789">固有品：${seenArea?M.n.replace(/./g,'？'):'？？？'}</span>`}</div>`;
    A[1].forEach(([nm],i)=>{ const k=bkKey(a,i), n=(P.bk&&P.bk[k])||0, dt=(P.bkT&&P.bkT[k])||0;
      h+=`<div class="row" style="padding:2px 0"><div style="display:flex;gap:6px;align-items:center">${pic(a,i,n>0)}<div>${n?nm:'？？？'}<div class="small">${n?`倒した数 ${fmt(n)}　最深 ${dt<AREAS.length?A[0]:'第'+layerOf(dt)+'層'}`:'まだ出会っていない'}</div>${n?`<div class="small">${weakHTML(nm,A[1][i][1],n>=10)}</div>`:''}</div></div></div>`; });
    h+=`</details>`; });
  h+=`<div class="y" style="margin-top:8px">番人（次元の彼方の10層ごと）</div>`;
  GUARD_T.forEach(t=>{ const n=layerOf(t), b=guardBeaten(t), reach=t<=P.maxArea; if(!reach&&t>P.maxArea+10) return;  // 先の番人は次の1体だけ（#55）
    h+=`<div class="row"><div>${reach?makeGuard(t).name:`第${n}層の番人 ？？？`}<div class="small">${b?`<span class="g">討伐済み</span>　${t>=AREA_MAX?'無属性（等倍）':elTag(areaEl(t))+'・'+weakHTML(makeGuard(t).base,makeGuard(t).sp,true)}`:reach?'<span class="o">未討伐</span>':'まだたどり着いていない'}</div></div>${canGuard(t)?`<button onclick="fightGuard(${t})">挑む</button>`:''}</div>`; });
  return h; }

const champName=k=>k<CHAMPS.length?CHAMPS[k]:`${k-CHAMPS.length+2}代目 無限王`;
const CHAMP_MAX=300, GOD_TIER_MAX=330; // これ以上は数値があふれるので頭打ち
function makeChamp(k){ k=Math.min(k,CHAMP_MAX-1);
  const s=enemyStats(0.8+k*1.25); s.hp*=4; s.atk*=1.3; s.def*=1.3; s.gold*=10;
  const rl=areaLv(0.8+k*1.25); s.exp=need(rl)*(Math.pow(1.3,5)-1)/0.3; // 推奨Lvの人が+5Lv上がる量
  const last=k>=CHAMP_MAX-1; return elemize(Object.assign(s,{name:champName(k),base:champName(k),sp:'knight',hue:(k*67+20)%360,champ:true,lv:areaLv(0.8+k*1.25)}),last?'無':LAYER_EL[k%6],last);
}
function makeSecret(){
  const s=enemyStats(Math.min(GOD_TIER_MAX,14+(P?P.reb:0)*3)); s.hp*=5; s.atk*=2; s.def*=2; s.exp*=3; s.gold*=3;
  const r=P?P.reb:0; return elemize(Object.assign(s,{name:r?`創世神竜 アルケイオン・第${r+1}形態`:'創世神竜 アルケイオン',sp:'dragon',hue:(45+r*60)%360,secret:true}),'無',true);
}
// 危険度：自分が倒すまでのターン数と、倒されるまでのターン数の比
// 勝ちやすさ（自分が倒れるまでの時間 ÷ 敵を倒すまでの時間）。1.5以上なら「適正」（勝てる見込み）
function winRatio(e){ const p=attackPlan(e), q=defensePlan(e), pa=p.base*1.5*p.aff, ea=e.atk*1.5*ps('taken',1)*q.mul;
  const pd=p.aff===0?1e-300:Math.max(pa-p.edef*.5,pa*.08,1), ed=Math.max(ea-q.d*.5,ea*.08,1); return (maxhp()/ed)/(e.hp/pd); }
// 闘技場・神々の座に勝てそうになったら知らせる（#59）。それぞれ最初の1回だけポップアップ、そのあとは戦闘の結果に1行
function arenaNotice(){ if(!P||takashiLock()) return ''; P.pops=P.pops||{}; let line='';
  if(P.champ<CHAMP_MAX){ const c=makeChamp(P.champ); if(winRatio(c)>=1.5){
    if(!P.pops.arena){ P.pops.arena=true; holdEnd(); showPopup({title:'<span class="y">闘技場に挑めそうだ！</span>',body:`<div class="small">闘技場の${P.champ+1}人目の王者「${c.name}」に、今の強さなら勝てそうだ。<br><br>王者を倒すと、経験値と賞金がまとめて入る。勝つたびに次の王者が現れる。メニューの「闘技場」から挑もう。</div>`}); }
    else if(P.pops.arenaN!==P.champ){ P.pops.arenaN=P.champ; line+=`<div class="small y">🏟 闘技場の${P.champ+1}人目「${c.name}」に勝てそうだ</div>`; } } }
  if(!P.blessed[P.job]){ const g=makeSecret(); if(winRatio(g)>=1.5&&!P.pops['god_'+P.job]){ P.pops['god_'+P.job]=true;
    if(!P.pops.god){ P.pops.god=true; holdEnd(); showPopup({title:'<span class="mir">神々の座に挑めそうだ！</span>',body:'<div class="small">冒険の「神々の座」で待つ神に、今の強さなら勝てそうだ。<br><br>職業ごとに一度勝つと、その職業で「奇跡の加護」を授かる。</div>'}); }
    else line+=`<div class="small mir">✨ 今の職業（${JOBS[P.job].n}）で、神々の座に勝てそうだ</div>`; } }
  return line; }
function danger(e){
  const p=attackPlan(e), q=defensePlan(e), pa=p.base*1.5*p.aff, ea=e.atk*1.5*ps('taken',1)*q.mul;
  const pd=p.aff===0?1e-300:Math.max(pa-p.edef*.5,pa*.08,1), ed=Math.max(ea-q.d*.5,ea*.08,1);
  const r=winRatio(e);
  if(r>=5) return '<span class="g">楽勝</span>';
  if(r>=1.5) return '<span class="c">適正</span>';
  if(r>=.6) return '<span class="o">強敵</span>';
  return '<span class="r">無謀</span>';
}

// ============ 冒険者ギルド（#21）と素材・合成（#39） ============
// 素材：系統ごとに ふつう・レア・★1〜★5。★は50層ごとの節目の層（○○の巣）でだけ出る。能力には効かない（納品・合成用）
const GM_SP=[
  {sp:'slime', n:'スライム',  nest:50,  nm:['スライムゼリー','虹色ゼリー','王冠スライムの核']},
  {sp:'bat',   n:'コウモリ',  nest:100, nm:['コウモリの翼膜','夜明けの牙','月喰いの翼']},
  {sp:'eye',   n:'目玉',      nest:150, nm:['濁った水晶体','千里眼の瞳','神託の眼']},
  {sp:'skull', n:'骸骨',      nest:200, nm:['古い骨','呪われた髑髏','冥王の指輪']},
  {sp:'knight',n:'騎士',      nest:250, nm:['錆びた紋章','聖騎士の盾片','王家の剣']},
  {sp:'dragon',n:'竜',        nest:300, nm:['竜のうろこ','竜の逆鱗','竜王の心臓']},
];
const GM_P={n:.15,r:.02}, GM_STAR=[1024,2048,4096,8192,16384], GM_MUL_MAX=4;
// 天井（#74）：その素材が出ないまま、この数だけ倒すと次で必ず出る（★は節目の層で数える）
const GM_PITY={n:20,r:150,s:1000};
const gmPityMax=k=>Math.ceil(GM_PITY[k.endsWith('_n')?'n':k.endsWith('_r')?'r':'s']*gPityMul());
// 確率で出るか、天井に届いたら出す。出たら数え直し
function gmRoll(k,p,L){ P.gmPity=P.gmPity||{}; const c=(P.gmPity[k]||0)+1;
  if(chance(p)||c>=gmPityMax(k)){ P.gmPity[k]=0; gmAdd(k,1,L); } else P.gmPity[k]=c; }
const gmSp=sp=>GM_SP.find(x=>x.sp===sp);
// 素材のキー：slime_n（ふつう）・slime_r（レア）・slime_s1〜s5（★）
const gmKeys=()=>GM_SP.flatMap(g=>[g.sp+'_n',g.sp+'_r'].concat([1,2,3,4,5].map(s=>`${g.sp}_s${s}`)));
function gmName(k){ const [sp,t]=k.split('_'), g=gmSp(sp); if(!g) return k; if(t==='n') return g.nm[0]; if(t==='r') return g.nm[1]; return `${g.nm[2]}★${t.slice(1)}`; }
const gmN=k=>(P.gm&&P.gm[k])||0;
function gmAdd(k,n,L){ P.gm=P.gm||{}; P.gmF=P.gmF||{}; const first=!P.gmF[k]; P.gm[k]=gmN(k)+n; P.gmF[k]=(P.gmF[k]||0)+n;
  gCollectCheck(L);
  const star=k.includes('_s'); if(L) L.push(`<span class="${star?'mir':k.endsWith('_r')?'c':'g'}">${star?'★ ':''}素材「${gmName(k)}」を手に入れた！${first?'（初めて）':''}</span>`); }
// 出やすさ：LUK・実りの首飾り・果実酒・職業（盗賊系など）・固有品。最大×4
const gmMul=()=>{ const lk=st('luk'); return Math.min(GM_MUL_MAX,(1+lk/(lk+1000))*ps('drop',1)*matMul('drop')*drinkMul('drop'))*gDropMul(); };
// 節目の層（第50・100・…・300層）は、その系統だけが出る「巣」
const nestOf=t=>{ if(t<AREAS.length) return null; const n=layerOf(t); return n%50===0?GM_SP.find(g=>g.nest===n)||null:null; };
const NEST_NM={slime:'巣くうスライム',bat:'群れなすコウモリ',eye:'ひしめく目玉',skull:'眠らぬ骸骨',knight:'亡国の騎士',dragon:'巣を守る竜'};
function gmDrop(e,t,L){ if(!e.sp||e.flat&&!e.guard) return; const g=gmSp(e.sp); if(!g) return; const m=gmMul();
  gmRoll(g.sp+'_n',GM_P.n*m,L);
  gmRoll(g.sp+'_r',GM_P.r*m,L);
  const ne=t>=0?nestOf(t):null;
  if(ne&&ne.sp===e.sp) GM_STAR.forEach((d,i)=>gmRoll(`${g.sp}_s${i+1}`,m/d,L)); }
// 節目の層の番人を初めて倒すと★1が1個
function gmGuardBonus(e,L){ const ne=nestOf(e.gt); if(ne&&!(P.gmG&&P.gmG[ne.nest])){ P.gmG=P.gmG||{}; P.gmG[ne.nest]=true; gmAdd(ne.sp+'_s1',1,L); } }

// ---- 合成（#39）：武器屋は段20（インフレ）まで。その先は素材＋お金で＋1ずつ ----
const SHOP_MAX=20;
const W_SP={剣:'dragon',大剣:'dragon',斧:'knight',小剣:'bat',槍:'bat',弓:'eye',棍棒:'skull',体術:'skull',杖:'slime'};
const A_SP={鎧:'knight',軽装:'bat',ローブ:'eye'};
// 無職（辞表）のときは、辞表の下にある元の武器の種類で数える
const synthWType=()=>neetW()?(P.wType||'体術'):myWType();
const synthSp=isW=>isW?W_SP[synthWType()]||'dragon':A_SP[armStyle()]||'knight';
// 次の段に必要な素材 [[キー,個数],…]
function synthNeed(isW,i){ const sp=synthSp(isW), p=i-SHOP_MAX;
  if(i>=GEAR_MAX) return GM_SP.map(g=>[g.sp+'_s5',1]);
  if(p<=30) return [[sp+'_n',3]];
  if(p<=60) return [[sp+'_r',1],[sp+'_n',5]];
  const s=p<=68?1:p<=76?2:p<=84?3:p<=91?4:5; return [[`${sp}_s${s}`,1],[sp+'_r',3]]; }
const synthOk=(isW,i)=>synthNeed(isW,i).every(([k,n])=>gmN(k)>=n);
// 合成の値段（#40）：武器屋の値段と「最深エリアの敵のお金×○戦分」の高いほう。ふつう10・レア50・★k 100×k・伝説2000
function synthPrice(isW,i){ const p=i-SHOP_MAX, n=i>=GEAR_MAX?2000:p<=30?10:p<=60?50:100*(p<=68?1:p<=76?2:p<=84?3:p<=91?4:5); return Math.max(isW?wpnPrice(i):armPrice(i),goldBase()*n*gDisc()); }
function synth(p){ const isW=p==='wpn', cur=isW?P.wpn:P.arm, i=cur+1; if(cur<SHOP_MAX||i>GEAR_MAX) return;
  const pr=synthPrice(isW,i); if(P.gold<pr||!synthOk(isW,i)) return;
  synthNeed(isW,i).forEach(([k,n])=>P.gm[k]-=n); P.gold-=pr; if(isW) P.wpn=i; else P.arm=i; P.synthN=(P.synthN||0)+1;
  save(); renderStatus(); panel(p); }
function synthHTML(isW){ const cur=isW?P.wpn:P.arm, i=cur+1; if(cur<SHOP_MAX||i>GEAR_MAX) return '';
  const need=synthNeed(isW,i), pr=synthPrice(isW,i), ok=synthOk(isW,i)&&P.gold>=pr, g=gmSp(synthSp(isW));
  return `<div class="win" style="margin:6px 0;padding:6px 8px"><div class="y">鍛冶屋：合成で強化</div><div class="small">ここから先は、素材とお金で1段ずつ鍛える。${isW?`武器の種類（${synthWType()}）`:`防具の型（${armStyle()}）`}では<b>${g.n}</b>の素材を使う${i>=GEAR_MAX?'（伝説は6系統の★5を1つずつ）':''}。</div>`+
    `<div class="row"><div>${i>=GEAR_MAX?'<span class="mir">？？？</span>':itemName(isW?WPN:ARM,i)}<div class="small">${isW?'ATK':'DEF'}+${fmt(isW?wpnPow(i):armPow(i))}　${fmt(pr)}G<br>`+
    need.map(([k,n])=>`<span class="${gmN(k)>=n?'g':'o'}">${gmName(k)} ${gmN(k)}/${n}</span>`).join('　')+`</div></div><button ${ok?'':'disabled'} onclick="synth('${isW?'wpn':'arm'}')">合成</button></div></div>`; }

// ---- ギルド（#21） ----
const G_RANKS=['F','E','D','C','B','A','S'], G_NEED=[0,10,30,70,150,300,600];
const gState=()=>{ if(!P.guild) P.guild={pts:0,done:0,board:[],offers:[],cd:[],streak:0}; const g=P.guild; g.board=(g.board||[]).filter(Boolean); g.offers=g.offers||[]; g.cd=g.cd||[]; return g; };
// 無職になったら（無職が解放されたら）転職所はいつでも開く。ギルドに入れない無職が詰まないように
const jobOpen=()=>P.jobOpen!==false||P.job==='neet'||!!(P.unlocked&&P.unlocked.neet);
const G_OFFERS=5;
const gRank=()=>{ const p=gState().pts; let r=0; G_NEED.forEach((n,i)=>{ if(p>=n) r=i; }); return r; };
const gSlots=()=>3+(gRank()>=2?1:0)+(gRank()>=5?1:0);
const gDisc=()=>P&&P.guild&&gRank()>=4?.8:1;  // ランクB：酒場・ショップ2割引き（#78）
const G_TYPES=['kill','weak','job','nohalf','boss','drink','casino','deliver','appraise','firstjob'];
// 依頼のカテゴリ（#61）
const G_CAT={kill:'討伐',weak:'討伐',job:'職業',firstjob:'職業',nohalf:'腕試し',boss:'腕試し',deliver:'収集',appraise:'収集',drink:'寄り道',casino:'寄り道'};
// 戦闘に効かないお酒は、お酒の依頼に使わない（ギャンブルの酒はギャンブルの依頼で使う）
const G_DRINK_NG=['cas','forge','nohang'];
// 職業の依頼は「次に目指す職業」から（#68）：まだ極めていない、なれる職業のうち一番下の格
function gNextJobs(){ const ok=Object.keys(JOBS).filter(k=>k!=='neet'&&k!=='apprentice'&&canJob(k)&&!isMaster(k)); if(!ok.length) return Object.keys(JOBS).filter(k=>k!=='neet'&&canJob(k)); const r=Math.min(...ok.map(k=>JOBS[k].rank)); return ok.filter(k=>JOBS[k].rank===r); }
const areaSps=()=>AREAS[P.maxArea%AREAS.length][1].map(x=>x[1]);
const maxLayer=()=>Math.max(0,layerOf(P.maxArea));
function gNew(){ const r=gRank(), types=G_TYPES.filter(t=>t!=='appraise'||r>=3&&GM_SP.some(g=>g.nest<=maxLayer())).filter(t=>t!=='deliver'||r>=1);
  const ty=types[Math.floor(Math.random()*types.length)], s=1+r*.5, pick=a=>a[Math.floor(Math.random()*a.length)];
  const q={ty,n:0,rk:r,sp:r>=6&&chance(.3)};
  const near=areaSps().filter(sp=>gmSp(sp)&&(r>=3||P.maxArea>=AIL_START||!['eye','bat','skull'].includes(sp)));
  if(ty==='kill'){ q.k=pick(near.length?near:['slime']); q.goal=Math.round(20*s); }
  if(ty==='weak'){ q.goal=Math.round(15*s); }
  if(ty==='job'){ const js=gNextJobs(); q.k=pick(js.length?js:['warrior']); q.up=JOBS[q.k].rank>JOBS[P.job].rank; q.goal=Math.round(30*s); }
  if(ty==='nohalf'){ q.goal=Math.round(5+r*2); }
  if(ty==='boss'){ q.k=P.champ<CHAMP_MAX?'champ':'god'; q.goal=1; }
  if(ty==='drink'){ const ds=DRINKS.filter(D=>D.left>0&&(!D.when||D.when())&&D.id!=='keta'&&!G_DRINK_NG.includes(D.k)); q.k=pick(ds.length?ds:DRINKS).id; q.goal=10; }
  if(ty==='casino'){ q.goal=3+r; const bk=DRINKS.find(D=>D.id==='bakuto'); if(bk&&(!bk.when||bk.when())&&chance(.4)) q.k='bakuto'; }
  if(ty==='deliver'){ const fs=GM_SP.filter(g=>gmFoundAny(g.sp)), g=pick(fs.length?fs:GM_SP); q.k=(r>=3&&chance(.4)?g.sp+'_r':g.sp+'_n'); q.goal=q.k.endsWith('_r')?1+Math.floor(r/3):3+r; }
  if(ty==='appraise'){ const g=pick(GM_SP.filter(g=>g.nest<=maxLayer())); q.k=`${g.sp}_s${Math.max(1,Math.min(5,r-2))}`; q.goal=1; }
  return q; }
const gmFoundAny=sp=>Object.keys(P.gmF||{}).some(k=>k.startsWith(sp+'_'));
// 候補を5件並べ、そこから選んで受ける（#68）。最初の依頼は「転職所で転職しよう」だけ（#58）
function gFill(){ const g=gState();
  if(!jobOpen()){ if(!g.board.some(q=>q.ty==='firstjob')&&!g.offers.some(q=>q.ty==='firstjob')) g.offers=[{ty:'firstjob',n:0,goal:1,rk:0}]; return; }
  g.offers=g.offers.filter(q=>q&&q.ty!=='firstjob'); while(g.offers.length<G_OFFERS) g.offers.push(gNew()); }
function gAccept(i){ const g=gState(), q=g.offers[i]; if(!q||g.board.length>=gSlots()) return; g.offers.splice(i,1); g.board.push(q);
  if(q.ty==='firstjob'){ q.k=P.job; P.jobOpen=true; showPopup({title:'<span class="y">転職所が開いた！</span>',body:'<div class="small">受付嬢「転職所では、今の職業から別の職業に変えられます。職業ごとに得意な能力や技がちがうんですよ。好きな職業を選んで、転職してみてくださいね」<br><br>メニューの「転職所」から転職できる。</div>'}); }
  gFill(); save(); panel('area','guild'); }
function gText(q){ const N=q.goal;
  return q.ty==='firstjob'?'転職所で、好きな職業に転職する':q.ty==='kill'?`${gmSp(q.k).n}系の敵を${N}体倒す`:q.ty==='weak'?`弱点の属性で${N}体倒す`:q.ty==='job'?`${q.up?'昇格：':''}${JOBS[q.k].n}${q.up?'に転職して':'で'}${N}勝する`:
    q.ty==='nohalf'?`HPが半分を切らずに${N}連勝する`:q.ty==='boss'?(q.k==='champ'?'闘技場の王者を1人倒す':'神々の座で1勝する'):
    q.ty==='drink'?`${(DRINKS.find(D=>D.id===q.k)||{n:'お酒'}).n}を飲んだまま${N}勝する`:q.ty==='casino'?`${q.k==='bakuto'?'博徒の酒を飲んだまま、':''}ギャンブル場で${N}回勝つ`:
    q.ty==='deliver'?`素材「${gmName(q.k)}」を${N}個納める`:`★素材「${gmName(q.k)}」を鑑定してもらう`; }
const gProg=q=>q.ty==='firstjob'?((P.job!==q.k||takashiLock())?1:0):q.ty==='deliver'?Math.min(q.goal,gmN(q.k)):q.ty==='appraise'?Math.min(1,gmN(q.k)):q.n;
const gDoneQ=q=>gProg(q)>=q.goal;
// 報酬：お金（最深エリアの敵の数十戦分）・熟練度・能力の実・ギルドポイント。★の鑑定は10倍、特別依頼（S）は2倍
function gReward(q){ const m=(q.ty==='firstjob'?3:q.ty==='appraise'?10:q.ty==='deliver'&&q.k.endsWith('_r')?3:1)*(q.sp?2:1)*(1+q.rk*.5);
  const M=m*gRewardMul();
  return {gold:Math.floor(enemyStats(P.maxArea).gold*20*M), jexp:Math.floor(50*M*gJexpMul()), fruit:Math.max(1,Math.floor(rnd(1,4)*(P.maxArea+1)*M)), pts:Math.round((1+q.rk)*(q.ty==='appraise'?3:1)*(q.sp?2:1))}; }
function gReport(i){ const g=gState(), q=g.board[i]; if(!q||!gDoneQ(q)||P.job==='neet') return; const R=gReward(q), L=[];
  if(q.ty==='deliver') P.gm[q.k]-=q.goal;
  const r0=gRank(); P.gold+=R.gold; P.earned=(P.earned||0)+R.gold; gainJob(R.jexp,L); const k=KEYS[Math.floor(Math.random()*KEYS.length)]; fruitGet(k,R.fruit); g.pts+=R.pts; g.done=(g.done||0)+1; gBonusMat(q,L); if(gRank()>r0) gRankUp(L);
  g.board.splice(i,1); gFill();
  gMsg=`<div class="g">依頼を達成した！ ${fmt(R.gold)}G・熟練度+${fmt(R.jexp)}・${KN[k]}の実（+${fmt(R.fruit)}）・ギルドポイント+${R.pts}</div>`+(gRank()>r0?`<div class="mir">★ ギルドランクが${G_RANKS[gRank()]}に上がった！ ★</div>`:'')+L.join('');
  save(); renderStatus(); panel('area','guild'); }
function gDrop(i){ const g=gState(); const q=g.board[i]; if(!q||q.ty==='firstjob') return; g.board.splice(i,1); gMsg='<div class="small o">依頼を取り下げた。</div>'; save(); panel('area','guild'); }
let gMsg='';
// 戦闘のあとに呼ぶ：依頼の進み具合
function guildAfter(res,e,t,c){ if(!P.guild||P.job==='neet') return; const g=gState();
  if(res!=='win'){ g.streak=0; g.board.forEach(q=>{ if(q&&q.ty==='nohalf') q.n=0; }); gFill(); return; }
  const half=(c.minR??1)>=.5; g.streak=half?(g.streak||0)+1:0;
  g.board.forEach(q=>{ if(!q||gDoneQ(q)) return;
    if(q.ty==='kill'&&e.sp===q.k&&!e.flat) q.n++;
    if(q.ty==='weak'&&c.plan&&!e.flat&&elMul(c.plan.el,e.el)>1) q.n++;
    if(q.ty==='job'&&P.job===q.k) q.n++;
    if(q.ty==='nohalf') q.n=half?q.n+1:0;
    if(q.ty==='boss'&&((q.k==='champ'&&e.champ)||(q.k==='god'&&e.secret))) q.n++;
    if(q.ty==='drink'&&activeDrinks().some(x=>x.D.id===q.k)) q.n++; });
  gFill(); }
function guildCasinoWin(){ if(!P||!P.guild||P.job==='neet') return; gState().board.forEach(q=>{ if(q&&q.ty==='casino'&&!gDoneQ(q)&&(!q.k||activeDrinks().some(x=>x.D.id===q.k))) q.n++; }); }
function guildHTML(){ let h=`<h3 style="margin:0 0 4px">冒険者ギルド</h3>`;
  if(P.job==='neet') return h+`<div class="o">受付嬢「すみません、ギルドは職業についている方のための場所なんです。お仕事なら、ハローワークへどうぞ」</div>`;
  const g=gState(); gFill(); const r=gRank();
  // 受付嬢（仮：酒場のマスターの色違い）
  const lines=r>=6?['「英雄さま、お帰りなさいませ！ ギルド一同、お待ちしておりました」','「英雄さまの依頼は、報酬を3倍にしてお渡ししますね」','「ギルドの誇りです。どうか無理だけはなさらないで」']:['「ようこそ、冒険者ギルドへ！ 今日はどの依頼にしますか？」','「達成したら、忘れずに報告してくださいね」','「★の素材は、節目の層の巣でしか見つからないそうですよ」'];
  h+=(typeof artMode!=='undefined'&&artMode==='pix'&&PIX.t&&PIX.t.master)?`<div class="barscene"><img class="pix tav" style="filter:hue-rotate(150deg) saturate(1.3)" src="${PIX.t.master}" alt=""><div><div class="y">受付嬢（仮）</div><div class="small">${lines[(g.done||0)%lines.length]}</div></div></div>`:`<div class="small c">受付嬢${lines[(g.done||0)%lines.length]}</div>`;
  h+=`<div class="small">ギルドランク <b class="y">${G_RANKS[r]}</b>（${g.pts}pt${r<6?` / 次の${G_RANKS[r+1]}まで ${G_NEED[r+1]-g.pts}pt`:''}）　達成 ${g.done||0}件</div>`;
  h+=`<details style="margin:2px 0"><summary class="small y">ランクの恩恵（下のランクの分も残る）</summary><div class="small">`+G_PERKS.map(([n,t],i)=>`<div class="${r>=i+1?'g':''}" style="${r>=i+1?'':'color:#9ab'}">${r>=i+1?'✓':'・'} ${n}：${t}</div>`).join('')+`</div></details>`;
  if(gMsg){ h+=gMsg; gMsg=''; }
  const qrow=(q,btn)=>{ const R=gReward(q); return `<div class="row"><div style="flex:1;min-width:0"><span class="small c">【${G_CAT[q.ty]}】</span>${q.sp?'<span class="mir">【特別】</span>':''}${gText(q)}<div class="small">${fmt(gProg(q))}/${fmt(q.goal)}　報酬 ${fmt(R.gold)}G・熟練度・能力の実・${R.pts}pt</div></div>${btn}</div>`; };
  h+=`<div class="y" style="margin-top:6px">受けている依頼（${g.board.length}/${gSlots()}）</div>`;
  if(!g.board.length) h+=`<div class="small" style="color:#9ab">（まだ受けていない。下の候補から選ぼう）</div>`;
  g.board.forEach((q,i)=>{ const ta=gDoneQ(q)?null:questAreaOf(q);
    h+=qrow(q,gDoneQ(q)?`<button class="y" onclick="gReport(${i})">報告</button>`:q.ty==='firstjob'?'':`<div style="display:flex;flex-direction:column;gap:3px">${ta!==null?`<button class="y" style="font-size:11px" onclick="fightArea(${ta})">向かう</button>`:''}${q.ty==='job'&&P.job!==q.k&&canJob(q.k)?`<button class="y" style="font-size:11px" onclick="gJobChange('${q.k}')">転職する</button>`:''}<button style="font-size:11px" onclick="gDrop(${i})">取り下げ</button></div>`)
      +(ta!==null?`<div class="small" style="color:#9ab;margin:-2px 0 4px">行き先：${areaName(ta)}（冒険の画面のいちばん上にも出る）</div>`:''); });
  h+=`<div class="y" style="margin-top:8px">依頼の候補</div>`;
  g.offers.forEach((q,i)=>{ h+=qrow(q,`<button ${g.board.length>=gSlots()?'disabled':''} onclick="gAccept(${i})">受ける</button>`); });
  h+=`<div class="small" style="margin-top:8px;color:#9ab">素材の一覧と説明は、冒険の「図鑑 → アイテム」で見られる。</div>`;
  return h; }

// 収集の依頼がそろったら知らせる（#57）
let gPop=null;
function gCollectCheck(L){ if(!P.guild) return; P.guild.board.forEach(q=>{ if((q.ty==='deliver'||q.ty==='appraise')&&!q.ntf&&gDoneQ(q)){ q.ntf=true; gPop=gText(q); if(L) L.push(`<span class="mir">★ ギルドの依頼「${gPop}」の素材がそろった！ 報告に行こう</span>`); } }); }
function gPopShow(){ if(!gPop) return; const t=gPop; gPop=null; holdEnd(); showPopup({title:'<span class="y">素材がそろった！</span>',body:`<div class="small">ギルドの依頼「${t}」に必要な素材がそろった。冒険の画面の「ギルド」で報告しよう。</div>`}); }
// 冒険の画面：今いちばん奥のエリアで出る素材と、持っている数（#57）
function areaGmHTML(){ const sps=[...new Set(areaSps())].filter(gmSp); if(!sps.length||!tutDone()) return '';
  return `<div class="small" style="margin:4px 0;color:#9ab">${areaName(P.maxArea)}で出る素材：`+sps.map(sp=>`${gmName(sp+'_n')}×${gmN(sp+'_n')}・${P.gmF&&P.gmF[sp+'_r']?gmName(sp+'_r'):'？？？'}×${gmN(sp+'_r')}`).join('　')+`</div>`; }

// 受けている依頼に向かえるエリア（冒険の画面のいちばん上に出す）
function questAreaOf(q){ const sp=q.ty==='kill'?q.k:q.ty==='deliver'?q.k.split('_')[0]:null;
  if(q.ty==='appraise'){ const g=gmSp(q.k.split('_')[0]); const t=g?g.nest+AREAS.length-1:-1; return t>=0&&t<=P.maxArea?t:null; }
  if(!sp) return null;
  for(let t=P.maxArea;t>=0;t--){ const ne=nestOf(t); if(ne?ne.sp===sp:AREAS[t%AREAS.length][1].some(x=>x[1]===sp)) return t; }
  return null; }
function questAreaHTML(){ if(!P.guild||P.job==='neet') return ''; const rows=gState().board.filter(q=>!gDoneQ(q)).map(q=>[q,questAreaOf(q)]).filter(([q,t])=>t!==null);
  if(!rows.length) return '';
  return `<div class="win" style="margin:6px 0;padding:6px 8px"><div class="y">依頼に向かう</div>`+rows.map(([q,t])=>`<div class="row"><div style="flex:1;min-width:0"><span class="small">${gText(q)}（${fmt(gProg(q))}/${fmt(q.goal)}）</span><div class="small" style="color:#9ab">${areaName(t)}</div></div><button onclick="fightArea(${t})">戦う</button></div>`).join('')+`</div>`; }

// ギルドから直接転職（#73）
function gJobChange(k){ if(!canJob(k)||P.job===k) return; changeJob(k); gMsg=`<div class="g">${JOBS[k].n}に転職した！</div>`; panel('area','guild'); }
// ============ アイテム図鑑（#70）・合成の導線（#64）・お知らせ（#67） ============
// 素材の説明書き（系統ごとに ふつう・レア・★）
const GM_DESC={
  slime:['ぷるぷるのゼリー。乾かすと意外に硬く、鍛冶の繋ぎに使われる','光を当てると七色に揺らめくゼリー。魔力をよく通す','王冠をかぶった巨大スライムの核。脈打つたびに桁がひとつ増える気がする'],
  bat:['薄く丈夫な翼膜。音をよく吸うので、防具の裏地に重宝される','夜明けの光を浴びても溶けない牙。夜の王の名残','月を喰らったと伝わる翼。広げると、あたりが一瞬だけ夜になる'],
  eye:['白く濁った水晶体。磨けば、それなりに遠くが見える','千里を見通す瞳。のぞき込むと、自分の背中が見える','神の言葉を映す眼。見てはいけない未来まで見えてしまう'],
  skull:['ただの古い骨。けれど、なぜか温かい','呪いのこもった髑髏。持ち主の運を、ほんの少しだけ吸う','冥府の王がはめていた指輪。死の宣告を、跳ね返すという'],
  knight:['錆びついた騎士団の紋章。かつての誇りが刻まれている','聖騎士の盾のかけら。いまだに守りの祈りが残っている','亡国の王家に伝わる剣。主を選び、選ばれた者には桁外れの力を与える'],
  dragon:['硬く、熱を帯びたうろこ。剣の刃に混ぜると切れ味が増す','竜の喉元に1枚だけ逆さに生えた鱗。触れた者は焼き尽くされるという','竜王の心臓。止まることなく脈打ち、炎と桁を生み続ける'],
};
const gmUse=k=>{ const [sp,t]=k.split('_'), ws=Object.keys(W_SP).filter(w=>W_SP[w]===sp), as=Object.keys(A_SP).filter(a=>A_SP[a]===sp);
  const who=[ws.length?ws.join('・'):'',as.length?'防具（'+as.join('・')+'）':''].filter(Boolean).join('、')||'—';
  const rng=t==='n'?'＋1〜＋60':t==='r'?'＋31〜＋98':`★${t.slice(1)}の段${t==='s5'?'・伝説':''}`;
  return `合成：${who}（${rng}）／ギルドへの${t.startsWith('s')?'鑑定':'納品'}`; };
const gmDesc=k=>{ const [sp,t]=k.split('_'); const d=GM_DESC[sp]; return d?d[t==='n'?0:t==='r'?1:2]+(t.startsWith('s')?`（★${t.slice(1)}：${['かすかに','ほのかに','はっきりと','まばゆく','目もくらむほど'][+t.slice(1)-1]}輝いている）`:''):''; };
const gmHint=k=>{ const [sp,t]=k.split('_'), g=gmSp(sp); return t.startsWith('s')?`${g.n}の巣（50層ごとの節目の層）で見つかるらしい`:`${g.n}系の敵が${t==='r'?'まれに':''}落とすらしい`; };
const MAT_DESC=['四つ葉のクローバー。拾うたびに、少しずつ運が向いてくる','森のどんぐり。かじると、なぜか経験がにじみ出す','古代の鉱石。武器に混ぜると攻撃が鋭くなる','砂漠の砂時計。落ちる砂がゆっくりになり、身のこなしが軽くなる','溶けない氷。身にまとえば守りが固くなる','火竜のうろこ。握るとSTRがみなぎる','幽霊船の羅針盤。なぜか金目のものの方角を指す','天使の羽根。そばにあるだけで体が丈夫になる','魔界の角。知恵が冴えわたる','混沌のかけら。能力の実が、よく実るようになる','虚無の砂。体の芯が強くなる','時の歯車。修行の時間が、少しだけ長くなる'];
let itemTab='mat', bookTab='mon';
function itemRow(found,name,count,desc,use,hint){ return found?`<div class="row"><div style="flex:1;min-width:0">${name}${count!==''?` <span class="small y">${count}</span>`:''}<div class="small">${desc}</div>${use?`<div class="small c">${use}</div>`:''}</div></div>`
  :`<div class="row"><div style="opacity:.55">？？？<div class="small">${hint||'まだ見つけていない'}</div></div></div>`; }

function takeBet(){ if(takashiLock()&&P.gold<1){ P.gold=10000; betNote='<div class="o">実家から仕送りが届いた…！ +10000G</div>'; save(); renderStatus(); }
  const b=betAmt(); lastAllIn=b>0&&b===P.gold; if(b<1){casMsg='<span class="r">賭けるお金がない！</span>'; return 0;} const before=P.gold; P.gold-=b; casBegin(b,before); if(P.casArm){ casCtx.sure=true; P.casArm=false; } shobuArm(); return b; }
function settle(bet,mult,txt){ P.casPlayed=true; let ret=payout(bet,mult), back=0; const notes=casCtx?casCtx.notes:[];
  let coinT='';
  if(ret>bet){ const w=casWinMul(); if(w.m!==1){ ret=bet+Math.floor((ret-bet)*w.m); if(w.t.length) notes.push(`<span class="c">【${JOBS[P.job].n}の特性】${w.t.join('・')}</span>`); } P.casStreak=(P.casStreak||0)+1;

    coinT=casCoinOnWin(mult); }
  else if(mult===0){ P.casWinRun=0; const L=casOnLoss(bet); back=L.back; if(L.t) notes.push(`<span class="c">${L.t}</span>`); if(isT('swordsaint')&&P.casStreak&&chance(.5)) notes.push('<span class="c">【無心】連勝は途切れない</span>'); else P.casStreak=0; ret=back; }
  casDrunkGo=false;

  casMsg = mult>0 ? `${txt} <span class="g">+${fmt(ret-bet)}G</span>` : `${txt} <span class="r">-${fmt(bet-back)}G</span>`;
  if(coinT) casMsg+=`<div>${coinT}</div>`;

  else if(D.k==='forge'){ P.forgeFree=true; msg=`<div class="g">${D.n}を飲んだ！ 精霊の加護で、次の1回は武器屋・防具屋の付け直しが無料になる。</div>`; }
  else { if(D.k==='nohang'&&P.hangover>0){ P.hangover=0; msg+=`<div class="g">頭痛がすっと引いた。二日酔いが治った！</div>`; }
    const n=Math.round(sakeLeft(D.left)*pow); P.dk=(P.dk||[]).filter(d=>d.left>0);
    const same=P.dk.find(d=>d.type===id);
    if(same){ same.left=n; same.pow=pow; delete same.mild; }
    else { if(P.dk.length>=drinkSlots()){ P.dk.sort((a,b)=>a.left-b.left); const old=P.dk.shift(), OD=DRINKS.find(x=>x.id===old.type); if(OD) msg+=`<div class="small o">${OD.n}の酔いが覚めた（同時に効くのは${drinkSlots()}杯まで）</div>`; }
      P.dk.push(first?{type:id,left:n,pow,mild:true}:{type:id,left:n,pow}); }
    if(first) msg+=`<div class="small c">はじめての一杯。ほろ酔いで済んだので、頭ははっきりしている（この杯では酔わない）。</div>`;
    msg+=`<div class="g">${D.n}を飲んだ！ 次の${n}戦、${drinkEff(D)}${pow>1?`（熟成×${pow.toFixed(2)}）`:''}</div>`;
    for(const c of activeCocktails()) if(!ck0.includes(c.id)){ P.cocktails=P.cocktails||{}; const first=!P.cocktails[c.id]; P.cocktails[c.id]=true; msg+=`<div class="mir">★ カクテル「${c.n}」！ ${c.d}${first?'（はじめて作った）':''} ★</div>`; } }
  if(sakeLv()>lv0) msg+=`<div class="mir">★ 酒豪Lv${sakeLv()}「${SAKE_TITLE[sakeLv()]}」になった！ お酒がより強く・長く効く ★</div>`;
  if(!first&&chance(Math.max(.005,.05*(1-sakeLv()*.09)))){ const lost=Math.floor(P.gold*.1); P.gold-=lost; P.memLoss=(P.memLoss||0)+1; msg+=`<div class="r">…気がつくと朝だった。記憶が飛んでいる。財布が軽い…（-${fmt(lost)}G）</div>`; }
  return msg; }
// 酒蔵（#10 案6）：お酒を預けて寝かせると、実際の時間で熟成する（48時間で最大。効き目が最大2乗・続く戦闘数が最大2倍）
const CELLAR_MAX=3, AGE_FULL_H=48;
const ageH=c=>Math.max(0,Math.min(AGE_FULL_H,(Date.now()-c.t)/3600000));
const agePow=c=>1+ageH(c)/AGE_FULL_H;
const cellarOk=D=>drinkOpen(D)&&D.left>0;
function cellarPut(id){ const D=DRINKS.find(x=>x.id===id); if(!D||!cellarOk(D)) return; P.cellar=P.cellar||[]; if(P.cellar.length>=CELLAR_MAX) return;
  const pr=drinkPrice(D); if(P.gold<pr) return; P.gold-=pr; P.cellar.push({type:id,t:Date.now()});
  barMsg=`<div class="g">${D.n}を酒蔵に預けた。寝かせるほどうまくなる（48時間で最高）。</div>`; save(); renderStatus(); panel('bar'); }
function cellarTake(i){ P.cellar=P.cellar||[]; const c=P.cellar[i]; if(!c) return; const D=DRINKS.find(x=>x.id===c.type); P.cellar.splice(i,1); if(!D){ save(); panel('bar'); return; }
  const h=ageH(c); P.agedMax=Math.max(P.agedMax||0,h); barMsg=`<div class="small">${Math.floor(h)}時間${Math.floor((h%1)*60)}分寝かせた${D.n}を開けた。</div>`+applyDrink(D,agePow(c)); save(); renderStatus(); panel('bar'); }

function buyRumor(){ const pr=rumorPrice(); P.rumors=P.rumors||{};

  // 2) 今すぐ役に立つ噂があれば、お金をもらって話す
  const fresh=left.filter(r=>r.when()&&!r.found());
  if(fresh.length){ if(P.gold<pr){ barMsg='<div class="small">マスター「お話ししてもいいけれど…お代が足りないみたいね」</div>'; panel('bar','rumor'); return; } P.gold-=pr; const r=fresh[Math.floor(Math.random()*fresh.length)]; P.rumors[r.id]=true;

// 飲み比べ：VITとLUKで勝負。勝つと賞金
const RIVALS=[
 {id:'gen',n:'常連のゲン',t:2},{id:'oba',n:'酒豪のオババ',t:8},{id:'don',n:'樽男ドンゴ',t:20},{id:'uwa',n:'蟒蛇（うわばみ）の姐さん',t:45},{id:'bacchus',n:'酒神バッカス',t:90},
];
// 酒の強さ：冒険の進み具合＋VITと運（桁数）。相手の強さ t とほぼ同じ物差し
const tolerance=()=>P.maxArea*.8+Math.log10(st('vit')+st('luk')+10)*1.5+P.lv/100;
function rivalTol(R){ return R.t; }
// 飲み比べの相手は順番に出る（#52）：前の相手に一度でも勝つと次が出る。一度勝った相手はずっと出る
const rivalWins=i=>(P.contest&&RIVALS[i]&&P.contest[RIVALS[i].id])||0;
const rivalOpen=i=>i===0||rivalWins(i)>0||rivalWins(i-1)>0;
function contest(i){ const R=RIVALS[i]; if(!R||!rivalOpen(i)) return; const fee=Math.max(50,Math.floor(enemyStats(Math.min(R.t,P.maxArea)).gold*goldRate(Math.min(R.t,P.maxArea))*5)); if(P.gold<fee) return;
  P.gold-=fee; P.contestTries=(P.contestTries||0)+1;
  let me=tolerance(), you=rivalTol(R), cup=0, lines=[], res=null; const nm=esc(P.name);
  while(res===null&&cup<500){ cup++; me-=rnd(.4,1.6)*(1+cup*.05); you-=rnd(.4,1.6)*(1+cup*.05);
    if(cup%3===0||me<=0||you<=0) lines.push(`${cup}杯目… ${nm}${me<2?'の目が泳いでいる':'はまだ平気そうだ'}／${R.n}${you<2?'がふらついている':'は涼しい顔'}`);
    if(me<=0&&you<=0) res=chance(.5); else if(me<=0) res=false; else if(you<=0) res=true; }
  let msg=lines.slice(-4).join('<br>');
  if(res){ const prize=Math.floor(fee*(8+i*4)); P.gold+=prize; P.earned=(P.earned||0)+prize; P.contest=P.contest||{}; P.contest[R.id]=(P.contest[R.id]||0)+1; P.contestWins=(P.contestWins||0)+1;
    msg+=`<div class="mir">★ ${R.n}が先に倒れた！ ${nm}の勝ち！ ★ 賞金 ${fmt(prize)}G</div>`;
    if(isTakashi()) msg+=startPersona('gamble','shukuhai'); }
  else if(res===null) msg+=`<div class="r">${cup}杯飲んでも決着がつかず、店じまい… 参加費 ${fmt(fee)}G は戻らない</div>`;
  else msg+=`<div class="r">${nm}は${cup}杯目で潰れた… 参加費 ${fmt(fee)}G は戻らない</div>`;
  barMsg=msg; save(); renderStatus(); panel('bar','contest'); }

// 酒神バッカスの攻略のヒント（酒場の「攻略」）：今の場所で、いちばん効く1つを教える
function bacchusHint(){
  const t=P.maxArea, sp=AREAS[t%AREAS.length][1], el=areaEl(t), wk=EL_WEAK(el);
  const enemies=sp.map(([nm,s])=>elemize(Object.assign({def:1},{name:nm,sp:s,base:nm}),el,false));
  const plans=enemies.map(attackPlan), nm=esc(P.name);
  // 1) 今の攻撃が効かない敵
  const bi=enemies.findIndex(e=>typeMul(attackPlan(e).at,e)<1);
  if(bi>=0){ const k=resKind(enemies[bi]);
    return `「${areaName(t)}${t>=AREAS.length?'は':'の'+enemies[bi].base+'は'}${tendName(k)}。${k==='phys'?'魔法職で挑むと楽じゃ':'物理の職業で、武器で殴ると楽じゃ'}（今のままでも半分は通る）。」`; }
  // 2) 属性が不利・弱点を突ける属性
  if(el!=='無'){ const em=elMul(myAtkEl(),el);
    if(em<5&&wk) return `「${areaName(t)}は${elTag(el)}の地。${elTag(wk)}の武器で攻めれば弱点を突ける（×5）。武器屋で付け直すがよい（${fmt(forgePrice(true))}G）。${em<1?`今の${elTag(myAtkEl())}では×${em}しか通らぬぞ。`:''}」`;
    const dm=elMul(el,myArmEl()); if(dm>1) return `「${elTag(el)}の攻撃に、今の${elTag(myArmEl())}の防具は弱い（受けるダメージ×${dm}）。防具の属性を変えるとよい。」`; }
  // 3) 得意な武器
  if(JOB_WT[P.job]&&prefMul()===1) return `「${JOBS[P.job].n}の得意は${JOB_WT[P.job]}じゃ。持ち替えれば×1.5。今の${myWType()}では本領が出ぬ。」`;
  // 3b) 状態異常を使う敵がいるのに、防ぐ装飾品がない（#44）
  { const ak=areaAils(t).find(k=>!accT(AILMENTS[k].acc)); if(ak){ const A=AILMENTS[ak], nm=ACC.find(x=>x[2]===A.acc)[1];
    return `「${areaName(t)}の敵は${A.n}を使ってくる。装飾品屋の${nm}を付けておくがよい（気付けの酒でも防げる）。」`; } }
  // 3c) 合成の素材が足りない（#44）
  if(P.wpn>=SHOP_MAX&&P.wpn<GEAR_MAX){ const need=synthNeed(true,P.wpn+1).find(([k,n])=>gmN(k)<n);
    if(need){ const g=gmSp(need[0].split('_')[0]); return need[0].includes('_s')?`「次の合成には${gmName(need[0])}がいる。${g.n}の巣、第${g.nest}層でしか出ぬ。LUKを上げて通うがよい。」`:`「次の合成には${gmName(need[0])}が${need[1]}個いる（いま${gmN(need[0])}個）。${g.n}系の敵を倒して集めるのじゃ。」`; } }
  // 4) 番人
  if(isGuardT(t)&&!guardBeaten(t)){ const g=makeGuard(t), best=[];
    return `「この層には${g.name}が待っておる。${best.length?best.join('・')+'がよく効く。':''}${g.el!=='無'?`属性は${elTag(g.el)}、${elTag(EL_WEAK(g.el))}で攻めよ。`:'あやつは相性の通じぬ相手よ。'}」`; }
  // 6) 闘技場・神々の座
  if(P.champ<CHAMP_MAX){ const c=makeChamp(P.champ); if(!c.flat) return `「闘技場の次の相手、${c.name}は${elTag(c.el)}の使い手。${elTag(EL_WEAK(c.el))}で挑むがよい。騎士は打と魔法に弱い。」`; }
  return `「${nm}よ、今の構えに迷いはない。あとは飲んで、戦うだけじゃ。」`; }

// ============ 最後のエンドコンテンツ：桁の神 ============
// 伝説の品（オーバーフロー・アンダーフロー・伝説装飾品4種・辞表・リクルートスーツ）をすべてそろえると現れる。
// 「輪廻の結界」は転生 FINAL_REB 回以上でないと破れない。ダメージは桁数（log10）で入り、HPは持ち越し。
const FINAL_REB=200, FINAL_HP=1000000, FINAL_TURNS=15;
const FINAL_NAME='桁の神 グーゴルプレックス';
const legendList=()=>[[wName(GEAR_MAX),legW()],[aName(GEAR_MAX),legA()]].concat(LACC.map(a=>[a[1],!!(P.lacc&&P.lacc[a[0]])])).concat([[NEET_W,!!P.neetW],[NEET_A,!!P.neetA]]);
const legendAll=()=>legendList().every(x=>x[1]);
const finalOpen=()=>legendAll()||!!(P.final&&(P.final.seen||P.final.cleared));
function finalState(){ if(!P.final) P.final={hp:FINAL_HP,cleared:false,seen:false,dmg:0}; const f=P.final; if(!f.form) f.form=f.cleared?Math.min(FINAL_FORMS,(f.best||1)+1):1; if(f.cleared&&!f.best) f.best=1; return f; }
// #23：倒すたびに次の形態（第10形態まで）。第n形態は HP 100万×1.5^(n−1) 桁、攻撃の割合＋5%×(n−1)
const FINAL_FORMS=10, finalHP=n=>Math.floor(FINAL_HP*Math.pow(1.5,n-1));
const finalDone=()=>{ const f=finalState(); return (f.best||0)>=FINAL_FORMS; };
const formName=n=>n<=1?'':`第${n}形態`;
// 桁の神の攻撃は最大HPに対する割合。伝説の防具・リクルートスーツでそれぞれ×0.7
const finalGuard=()=>(legA()?.7:1)*(P.neetA?.7:1);
function finalHit(c,turn,form){ const nm=esc(P.name), up=.05*(form-1);
  if(form>=2&&chance(.03)){ if(chance(Math.min(1,.1*accT('rDeath')))) c.L.push(`桁の神の「桁落とし」！ …しかし<span class="g">身代わり人形</span>が砕けて守った！`);
    else { c.php=0; c.L.push(`<span class="r">桁の神の「桁落とし」！ ${nm}の桁が、ひとつ残らず消えた…</span>`); return; } }
  const big=turn%5===0, r=big?.8:rnd(.15,.4)+up, d=Math.floor(c.mhp*r*finalGuard());
  c.php-=d; c.L.push(big?`<span class="crit">桁の神の「桁あふれ」！</span> ${nm}は<span class="dmg">${fmt(d)}</span>のダメージ！`:`桁の神の攻撃！ ${nm}は<span class="dmg">${fmt(d)}</span>のダメージ！`); }
const FINAL_LINES=['桁の神「数えきれぬものを、数えようとするか」','桁の神「お前の積み上げた桁など、我の前ではひと粒の砂」','空間の桁が、ひとつ、またひとつと崩れていく…','桁の神「無量大数の、その先を見たいか」','桁の神は∞を振りかざした！'];
function makeFinal(){ const f=finalState(); return elemize({name:(formName(f.form)?formName(f.form)+'・':'')+FINAL_NAME,sp:'dragon',hue:(Date.now()/40)%360,hp:f.hp,atk:0,def:0,agi:40,gold:0,exp:0,final:true},'無',true); }
function fightFinal(fast){ if(!finalOpen()||finalDone()) return; last={type:'final'}; runBattle(makeFinal(),-5,fast); }
function simulateFinal(e,fast){
  const f=finalState(); f.seen=true; const nm=esc(P.name), M=Math.max(1,P.reb/FINAL_REB);
  const form=f.form, mmp=maxmp(); const c={e,L:[],php:maxhp(),mhp:maxhp(),mp:mmp,mmp,ehp:f.hp,gold:0,buff:1,stun:false,forceMiracle:false,kaji:false,final:true,M,dealt:0};
  const L=c.L; c.buff*=battleBuffs(L);
  // 第4形態からは速さも増す（限界突破してAGIを育てないと、当てにくく避けにくい）
  c.spd=Math.max(.01,agiG()/(form>LB_FORM?Math.pow(1.8,form-LB_FORM):1));
  L.push(`<b class="mir">${e.name}</b>（残り ${fmt(f.hp)} / ${fmt(finalHP(form))} 桁）`);
  const barrier=P.reb<FINAL_REB;
  if(barrier) L.push(`<span class="o">輪廻の結界が神を包んでいる… 転生を重ねた者でなければ破れない（転生 ${P.reb}/${FINAL_REB}回）</span>`);
  else L.push(`<span class="c">輪廻の結界が砕けた！ ダメージは「桁数」で神に届く（転生ボーナス ×${M.toFixed(2)}）</span>`);
  if(!barrier&&P.ketaCoin){ P.ketaCoin=false; c.M*=2; L.push('<span class="mir">🪙 桁のコインが輝いた！ この戦いでは、与える桁ダメージ×2</span>'); }
  for(let turn=1;turn<=FINAL_TURNS&&c.ehp>0;turn++){
    L.push(`<span class="hpl">― ターン${turn} ―</span>`);
    if(accT('mpregen')) c.mp=Math.min(c.mmp,c.mp+c.mmp*.01*accT('mpregen'));
    if(barrier){ L.push(`${nm}の攻撃！ …輪廻の結界に阻まれた。`); continue; }
    playerHit(c);
    if(c.ehp<=0) break;
    if(chance(.5)) L.push(FINAL_LINES[Math.floor(Math.random()*FINAL_LINES.length)]);
    finalHit(c,turn,form);
    L.push(`<span class="hpl">${nm} HP ${fmt(Math.max(0,c.php))}/${fmt(c.mhp)} ${mpTag(c)}　|　桁の神 残り ${fmt(Math.max(0,c.ehp))} 桁</span>`);
    if(c.php<=0){ c.lost=true; break; }
  }
  P.battles++; jobBattle(1,L,c); drinkTick(L);
  f.hp=Math.max(0,c.ehp); f.dmg=(f.dmg||0)+c.dealt;
  // 負けても与えた桁は残る。神は、その戦闘で削られた桁の1割を取り戻す
  if(c.lost&&f.hp>0){ const h=Math.floor(c.dealt*.1); f.hp=Math.min(finalHP(form),f.hp+h); L.push(`<span class="r">${nm}は力尽きた…</span> 桁の神は ${fmt(h)} 桁を取り戻した。`); }
  let sum= barrier?`<span class="o">結界に阻まれた…（転生 ${P.reb}/${FINAL_REB}回）</span>`:c.lost?`<span class="r">敗北…</span> 与えた桁ダメージ ${fmt(c.dealt)} / 残り ${fmt(f.hp)}`:`<span class="c">与えた桁ダメージ ${fmt(c.dealt)}</span> / 残り ${fmt(f.hp)}`;
  if(f.hp<=0&&form>1){ f.best=form; c.trainMile=true;
    if(form>=FINAL_FORMS){ ['<span class="mir">★★★★★★★★★★</span>',`<span class="mir">${e.name}が、ついに崩れ落ちる。</span>`,'<span class="y">桁の神「…もう、数えるものは何もない。お前こそが、桁そのものだ」</span>',`<span class="mir">${nm}は「桁を超えた者」となった。</span>`,'<span class="small">― 真・THE END ―　インフレアドベンチャー</span>'].forEach(x=>L.push(x));
      sum=`<span class="mir">★ ${e.name}を倒した！ 真・THE END ★</span>`; }
    else { f.form=form+1; f.hp=finalHP(f.form); L.push(`<span class="mir">${e.name}を倒した！</span>`,`<span class="o">桁の神「…まだだ。桁は、まだ尽きぬ」 ― ${formName(f.form)}が目覚めた</span>`); sum=`<span class="mir">★ ${e.name}を倒した！ ★</span> 次は${formName(f.form)}（${fmt(f.hp)} 桁）`; } }
  if(f.hp<=0&&form===1&&!f.cleared){ f.cleared=true; f.best=1; c.trainMile=true; f.form=2; f.hp=finalHP(2);
    ['<span class="mir">★★★★★★★★★★</span>',`<span class="mir">${FINAL_NAME}が、静かに崩れていく。</span>`,
     '<span class="y">桁の神「…見事だ。数えきれぬものを、お前は数えきった」</span>',
     '<span class="y">はじまりの草原の1Gから、ここまで。すべての桁は、お前が積み上げたものだ。</span>',
     `<span class="mir">${nm}は「インフレの果てを見た者」となった。</span>`,
     '<span class="small">― THE END ―　インフレアドベンチャー</span>'].forEach(x=>L.push(x));
    sum='<span class="mir">★ 桁の神を倒した！ インフレの果てへ ★</span>'; }
  const head=`${FINAL_NAME}（${JOBS[P.job].n} 転生${P.reb}）`;
  LOGS.unshift({head,sum,lines:L}); if(LOGS.length>20) LOGS.length=20;
  save(); if(!fast) saveLogs();
  return {L,sum,trainMile:c.trainMile};
}

// 騎士・聖騎士の「万全」条件：戦闘開始時HP満タン（毎戦HP満タンで始まるので、実質いつでも。最初の被弾で判明）
function applySecret(c,S){ const fx=S.fx||{}; c.secOn=true;
  if(fx.atk) c.buff*=fx.atk; if(fx.taken) c.secTaken=(c.secTaken||1)*fx.taken; if(fx.eva) c.secEva=(c.secEva||0)+fx.eva;
  if(fx.crit) c.secCrit=true; if(fx.skill) c.secSkill=true; if(fx.multi) c.secMulti=(c.secMulti||0)+fx.multi; if(fx.zero) c.secZero=(c.secZero||0)+fx.zero;
  if(fx.gold) c.secGold=(c.secGold||1)*fx.gold; if(fx.drop) c.secDrop=true; if(fx.fruitX) c.secFruitX=(c.secFruitX||1)*fx.fruitX;
  if(!S.silentUntil) markSecret(c); }
function markSecret(c){ const S=JOB_SECRETS[P.job]; if(!S||!S.msg) return; c.L.push(`<span class="mir">【${JOBS[P.job].n}の秘密】${S.msg}</span>`);
  P.jsec=P.jsec||{}; if(!P.jsec[P.job]){ P.jsec[P.job]=true; c.L.push(`<span class="y">★ 職業の秘密「${S.n}」を発見した！</span>`); } }
function secretStart(c,e,t){ const S=JOB_SECRETS[P.job]; if(!S||(S.type!=='start'&&S.type!=='both')) return; let ok=false; try{ ok=S.c(c,e,t); }catch(x){} if(ok) applySecret(c,S); }
function secretDyn(c){ const S=JOB_SECRETS[P.job]; if(!S||c.secOn||(S.type!=='dyn'&&S.type!=='both')) return; let ok=false; try{ ok=(S.type==='both'?S.d:S.c)(c); }catch(x){} if(ok) applySecret(c,S); }
const jobSecretFound=k=>k==='fighter'?(P.kajiN||0)>0:k==='apprentice'?!!(P.blessed&&P.blessed.apprentice):!!(P.jsec&&P.jsec[k]);
// ============ MP（#34）と状態異常（#29） ============
// 装備している装飾品の、その種類の強化Lv（付けていなければ0）
const accT=t=>{ const a=accEqs().find(x=>x.t===t); return a?a.lv:0; };
// 最大MP。戦闘の最初は満タン。普通の攻撃は使わず、技だけが使う
function maxmp(){ return Math.floor((st('int')*2+st('luk')*.5+P.lv*5)*rmul()*Math.pow(1.5,accT('mpmax'))*drinkMul('mpmax')); }
const SKILL_MP=s=>s.heal?.25:s.multi?.25:s.sure?.3:s.buff?.15:s.stun?.15:s.gamble?.2:(s.steal||s.coin)?.1:.2;
const mpRage=()=>accT('mprage')?1.5+.1*accT('mprage'):0;
function mpCost(s,c){ let r=SKILL_MP(s)*(1-Math.min(.5,.05*accT('mpsave'))); if(mpRage()) r*=2; return c.mmp*r; }
// 技を出すときに MP を払う。足りなければ false（技は出ず、普通の攻撃）
function mpPay(c,s){ const cost=mpCost(s,c); if(c.mp<cost){ if(!c.mpWarn){ c.mpWarn=true; c.L.push(`<span class="small o">MPが足りない…技が出せない！</span>`); } return false; } c.mp-=cost; return true; }
const mpTag=c=>`MP ${fmt(Math.max(0,c.mp))}/${fmt(c.mmp)}`;

// 状態異常：麻痺（1〜2ターン動けない）・遅延（3ターン、自分の攻撃が1ターンおき）・即死（その場で敗北）
// ============ 状態異常（#65 #66）：9種類。層ごとに決まり、戦闘の最初に先手で仕掛けてくる ============
const AILMENTS={
  para:   {n:'麻痺',acc:'rPara',   p:.5, how:'にらみつけた'},
  slow:   {n:'遅延',acc:'rSlow',   p:.5, how:'超音波を放った'},
  poison: {n:'毒',  acc:'rPoison', p:.5, how:'毒の霧を吐いた'},
  blind:  {n:'暗闇',acc:'rBlind',  p:.5, how:'墨を吹きかけた'},
  silence:{n:'沈黙',acc:'rSilence',p:.5, how:'呪文を封じる歌をうたった'},
  curse:  {n:'呪い',acc:'rCurse',  p:.5, how:'呪いの言葉をささやいた'},
  charm:  {n:'魅了',acc:'rCharm',  p:.5, how:'妖しく見つめてきた'},
  stone:  {n:'石化',acc:'rStone',  p:.1, how:'石化の光を放った'},
  death:  {n:'即死',acc:'rDeath',  p:.1, how:'死の宣告を放った'},
};
const AIL_KEYS=Object.keys(AILMENTS);
// 最初の12エリアは1種類ずつ覚える。砂漠（4つ目）から
const AREA_AIL={3:['para'],4:['poison'],5:['blind'],6:['slow'],7:['silence'],8:['charm'],9:['curse'],10:['stone'],11:['death']};
// 次元の彼方：層ごとに「なし／1種類／2種類／3種類（混沌）」。浅い層は少なく、石化・即死は第30層から
function areaAils(t){ if(t<0) return []; if(t<AREAS.length) return AREA_AIL[t]||[];
  const n=layerOf(t), h=(n*37+11)%100, maxK=n<=20?1:n<=60?2:3, k=Math.min(maxK,h<25?0:h<60?1:h<85?2:3);
  const pool=AIL_KEYS.filter(a=>n>=30||(a!=='stone'&&a!=='death')), out=[]; let x=n*7+3;
  while(out.length<k){ const a=pool[x%pool.length]; if(!out.includes(a)) out.push(a); x=x*13+5; } return out; }
const ailNames=l=>l.map(k=>AILMENTS[k].n).join('・');
// 状態異常は4つ目のエリア（砂塵の砂漠）から。同じときに装飾品屋が開く（#48）
const AIL_START=3;
const accOpen=()=>P.maxArea>=AIL_START||Object.keys(P.acc||{}).length>0||!!(P.unlocked&&P.unlocked.neet);
function accIntro(){ if(P.pops&&P.pops.acc) return; P.pops=P.pops||{}; P.pops.acc=true;
  showPopup({title:'<span class="y">状態異常と装飾品屋</span>',body:`<div class="small">ここから先の敵は、戦闘の最初に<b>状態異常</b>を仕掛けてくる（麻痺・毒・暗闇など全9種類）。どの状態異常を使うかは、エリア一覧に出る。<br><br>ショップに<b>装飾品屋</b>が開いた。状態異常を防ぐ品（+1で50%）や、能力・戦闘・お金を伸ばす品がそろっている。</div>`}); }
const resRate=k=>{ const A=AILMENTS[k]; return drinkOn('nostat')?1:accT(A.acc)?accVal(A.acc,accT(A.acc)):0; };
// 1つの状態異常をかけてみる（防げたら false）
function applyAil(c,e,k){ const A=AILMENTS[k], nm=esc(P.name); if(!chance(A.p)) return false;
  if(chance(resRate(k))){ c.L.push(`${e.name}は${A.how}！ …しかし<span class="g">${drinkOn('nostat')?'気付けの酒':'装飾品'}</span>が防いだ！`); return false; }
  c.ails=c.ails||{}; c.ailHit=c.ailHit||[]; c.ailHit.push(k);
  const T={para:'麻痺した！（2ターン動けない）',slow:'動きが遅くなった！（手番が1ターンおき）',poison:'毒におかされた！',blind:'目が見えない！（攻撃が外れやすい）',silence:'声が出ない！（魔法が使えない）',curse:'呪われた！（技が出ない）',charm:'魅了された！',stone:'体が石になりはじめた！（3ターン後に石になる）',death:'倒れた…'};
  if(k==='para') c.para=2; else if(k==='charm') c.charm=1; else if(k==='stone') c.stone=3; else if(k==='death'){ c.php=0; P.deathN=(P.deathN||0)+1; } else c.ails[k]=true;
  c.L.push(`<span class="r">${e.name}は${A.how}！ ${nm}は${T[k]}</span>`); return true; }
// 戦闘の最初：状態異常を使う敵の先手。先制の鈴で防げることがある。番人はその層の全部を使う
function ailFirstStrike(c,e,t){ if(e.flat||e.final) return; const l=e.guard?areaAils(e.gt):areaAils(t); if(!l.length) return;
  if(accT('first')&&chance(accVal('first',accT('first')))){ c.L.push(`<span class="g">先制の鈴が鳴った！ ${e.name}より先に動いた</span>`); return; }
  (e.guard?l:[l[Math.floor(Math.random()*l.length)]]).forEach(k=>{ if(c.php>0) applyAil(c,e,k); }); }
// ============ 装飾品の合成（護符）#65：同じカテゴリの装飾品を1つにまとめて、枠を空ける ============
// 段階で広がる：武器屋・防具屋を買い切ったら2つ、第100層で3つ、第200層で4つ、桁の神を倒したらいくつでも
function amuMax(){ if(!(P.wpn>=SHOP_MAX||P.arm>=SHOP_MAX||(P.amu||[]).some(Boolean))) return 0;
  if(P.final&&P.final.cleared) return 99; const n=maxLayer(); return n>=200?4:n>=100?3:2; }
let amuSel=[];
const amuRareTotal=()=>GM_SP.reduce((a,g)=>a+gmN(g.sp+'_r'),0);
const amuCost=l=>({gold:Math.floor(l.reduce((a,k)=>a+accPrice(Math.max(0,accLv(k)-1)),0)),rare:Math.max(1,l.length-1)});
function amuPick(k){ const i=amuSel.indexOf(k); if(i>=0) amuSel.splice(i,1); else { if(amuSel.length&&accCatOf(amuSel[0])!==accCatOf(k)) amuSel=[]; if(amuSel.length<amuMax()) amuSel.push(k); } panel('acc'); }
function amuMake(){ const l=amuSel.filter(k=>accLv(k)>0&&!inAmu(k)); if(l.length<2||l.length>amuMax()) return; const c=amuCost(l);
  if(P.gold<c.gold||amuRareTotal()<c.rare) return;
  P.gold-=c.gold; let r=c.rare; while(r>0){ const g=GM_SP.slice().sort((a,b)=>gmN(b.sp+'_r')-gmN(a.sp+'_r'))[0]; P.gm[g.sp+'_r']--; r--; }
  P.amu=P.amu||[]; P.amu.push({parts:l}); const id='am'+(P.amu.length-1);
  P.accEq=accEqList().filter(k=>!l.includes(k)); if(accEqCount(accCatOf(l[0]))<accSlotsC(accCatOf(l[0]))) P.accEq.push(id);
  amuSel=[]; P.amuN=(P.amuN||0)+1; save(); renderStatus(); panel('acc'); }
function amuBreak(i){ if(!P.amu||!P.amu[i]) return; P.accEq=accEqList().filter(k=>k!=='am'+i); P.amu[i]=null; save(); renderStatus(); panel('acc'); }
function amuHTML(){ const mx=amuMax();
  if(!mx) return `<div class="small" style="margin-top:10px;color:#9ab">🔒 装飾品の合成（護符）：武器屋か防具屋を買い切ると、鍛冶屋で装飾品をまとめられるようになる。</div>`;
  let h=`<div class="y" style="margin-top:12px">装飾品の合成（護符づくり）</div><div class="small">同じカテゴリの装飾品を<b>${mx>=99?'いくつでも':mx+'つまで'}</b>1つにまとめて、枠を空ける。Lvは中身のいちばん低いものになる。いつでもばらせる（使った素材とお金は戻らない）。${mx<99?`<span style="color:#9ab">（${mx===2?'第100層で3つ':mx===3?'第200層で4つ':'桁の神を倒すといくつでも'}まとめられるようになる）</span>`:''}</div>`;
  const own=ACC.filter(a=>accLv(a[0])>0&&!inAmu(a[0]));
  h+=`<div style="display:flex;flex-wrap:wrap;gap:4px;margin:4px 0">`+own.map(([k,n])=>`<button style="font-size:11px" class="${amuSel.includes(k)?'sel':''}" onclick="amuPick('${k}')">${n}+${accLv(k)}</button>`).join('')+`</div>`;
  if(amuSel.length>=2){ const c=amuCost(amuSel), ok=P.gold>=c.gold&&amuRareTotal()>=c.rare;
    h+=`<div class="small">${amuName({parts:amuSel})}（+${Math.min(...amuSel.map(accLv))}）：${fmt(c.gold)}G・レア素材${c.rare}個（いま${amuRareTotal()}個）</div><button style="width:100%" ${ok?'':'disabled'} onclick="amuMake()">まとめる</button>`; }
  else h+=`<div class="small" style="color:#9ab">まとめたい装飾品を、同じカテゴリから2つ以上選ぶ。</div>`;
  return h; }

// 装飾品の枠が増えたら知らせる（#73）
function accSlotCheck(){ if(!P) return; const n=accSlots(); if(P.accSlotsSeen===undefined||P.accSlotsSeen===null){ P.accSlotsSeen=n; return; }
  if(n<=P.accSlotsSeen) { P.accSlotsSeen=n; return; } const was=P.accSlotsSeen; P.accSlotsSeen=n; save(); if(!accOpen()) return;
  const why=accFree()?'無職への道が開かれた':ACC_UNLOCKS.filter(([nm,v,f])=>f()).map(x=>x[0]).slice(-1)[0];
  if(typeof holdEnd==='function') holdEnd();
  showPopup({title:'<span class="y">装飾品の枠が増えた！</span>',body:`<div class="small">${why}ので、装飾品を付けられる数が <b>${was}</b> → <b class="y">${accFree()?'すべて':n}</b> になった。<br><br>装飾品屋で付けてみよう。</div>`}); }

const ART_FACE={slime:{eyes:[[25,40],[39,40]],r:3.4,mouth:[32,48,7]},bat:{eyes:[[27,33],[37,33]],r:2.8,mouth:[32,41,6]},
  eye:{eyes:[],r:0,mouth:null},skull:{eyes:[[24,30],[40,30]],r:4.2,mouth:null},dragon:{eyes:[[40,27]],r:3,mouth:[48,34,5]},knight:{eyes:[],r:0,mouth:null}};

function enemySVG(name,sp,hue,depth,opt={}){
  const rng=artRng(artHash(name+'|'+sp)); const c=Math.max(0,Math.min(1,depth));
  let style=opt.style||ART_FAM[sp]||'cute'; if(c>.66&&style!=='creepy'&&rng()<c-.5) style='creepy'; // 深層では、かわいい敵も崩れて不気味になる
  // 作り込み版がある系統は、そちらを使う（ボスの飾りなど opt があるときは従来版）
  if(!opt.halo&&!opt.crown&&!opt.style){
    if(sp==='slime'&&style==='cute') return deluxeSlime(hue,['ribbon','leaf','crown','none'][Math.floor(rng()*4)]);
    if(sp==='dragon'&&style==='cool') return deluxeDragon(hue,c);
    if(sp==='eye') return deluxeEye(hue,1+Math.floor(c*6)+(rng()<.5?1:0));
  }
  const pal=artPal(style,hue,c), F=ART_FACE[sp]||ART_FACE.slime, id='ag'+(++artUid);
  let back='', front='';
  const extra=Math.floor(c*6*(style==='creepy'?1.2:.7)+(style==='creepy'?rng()*2:0));
  const tent=Math.floor(c*6+(style==='creepy'&&rng()<.5?2:0));
  if(tent) back+=artTentacles(Math.min(7,tent),pal,sp==='skull'?50:54,rng);
  if(opt.halo) back+=artHalo(8,opt.halo);
  let body=artBody(sp,style,pal,rng,c);
  if(sp==='skull'){ front+=`<ellipse cx="24" cy="30" rx="6" ry="6.5" fill="#160c10"/><ellipse cx="40" cy="30" rx="6" ry="6.5" fill="#160c10"/>`;
    front+= style==='cute' ? artEye('cute',24,31,3,rng,pal)+artEye('cute',40,31,3,rng,pal) : `<circle class="ap" cx="24" cy="31" r="1.8" fill="${pal.acc}"/><circle class="ap" cx="40" cy="31" r="1.8" fill="${pal.acc}"/>`; }
  else if(sp==='knight'){ front+=`<circle class="ap" cx="28" cy="32" r="1.3" fill="${style==='creepy'?pal.acc:'#ff4d4d'}"/><circle class="ap" cx="36" cy="32" r="1.3" fill="${style==='creepy'?pal.acc:'#ff4d4d'}"/>`; }
  else { F.eyes.forEach(([x,y])=>front+=artEye(style,x,y,F.r*(style==='creepy'?1.1:1),rng,pal)); }
  if(F.mouth) front+=artMouth(style,...F.mouth,rng,pal);
  if(style==='cute'&&F.eyes.length>1) front+=`<ellipse cx="${F.eyes[0][0]-3}" cy="${F.eyes[0][1]+5}" rx="2.6" ry="1.5" fill="${pal.cheek}" opacity=".7"/><ellipse cx="${F.eyes[1][0]+3}" cy="${F.eyes[1][1]+5}" rx="2.6" ry="1.5" fill="${pal.cheek}" opacity=".7"/>`;
  // ランダムな付属パーツ
  const k=rng();
  if(sp!=='knight'){
    if(style==='cool'&&k<.6) front=artHorns(pal,sp==='dragon'?20:22,c>.4)+front;
    else if(style==='cute'&&k<.25) front+=`<path d="M32 ${sp==='slime'?18:22} q1 -6 6 -7" stroke="${pal.line}" stroke-width="1.4" fill="none"/><circle cx="38" cy="${sp==='slime'?11:15}" r="2.4" fill="${pal.acc}"/>`;
    else if(style==='cute'&&k<.4) front+=`<path d="M41 ${sp==='slime'?24:26} l3 -3 l3 3 l-3 3 z M44 ${sp==='slime'?21:23} l2 -2 l2 2 l-2 2z" fill="${pal.acc}" stroke="${pal.line}" stroke-width=".8"/>`;
  }
  if(opt.crown) front+=artCrown(sp==='dragon'?16:sp==='knight'?16:20);
  if(extra>0) front+=artExtraEyes(Math.min(9,extra),pal,rng,32,sp==='slime'?44:34,16);
  if(style==='creepy'&&rng()<.5) front+=`<path d="M${f1(20+rng()*8)} ${f1(24+rng()*10)} l6 4 m-4 -5 l3 6" stroke="${pal.vein}" stroke-width="1" opacity=".8"/>`;
  const warp=c>.25?`<filter id="${id}w" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="${f1(.04+c*.04)}" numOctaves="2" seed="${Math.floor(rng()*99)}"/><feDisplacementMap in="SourceGraphic" scale="${f1(c*5)}"/></filter>`:'';
  const glow=opt.glow?`<filter id="${id}g"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`:'';
  const fl=[warp?`url(#${id}w)`:'',glow?`url(#${id}g)`:''].filter(Boolean).join(' ');
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="art art-${style}"><defs>${warp}${glow}</defs><g ${fl?`filter="${fl}"`:''}><g class="abob">${back}${body}${front}</g></g></svg>`;
}

  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="art art-cute dx"><defs>
<radialGradient id="${id}b" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="${light}"/><stop offset=".45" stop-color="${base}"/><stop offset="1" stop-color="${deep}"/></radialGradient>

function heroSVG(job){
  const J=JOBS[job]||JOBS.warrior, col=`hsl(${J.hue},70%,55%)`, dark=`hsl(${J.hue},60%,30%)`, D='#1b1d2a';
  const rng=artRng(artHash(job)); const hair=['#3a2a1e','#c9873a','#222','#d9c27a','#7a3a2a'][Math.floor(rng()*5)];
  const [prop,hat]=HERO_KIT[job]||['sword','none']; const rank=J.rank||0;
  let back='', body='', face='';
  if(rank===2) back+=`<circle cx="32" cy="34" r="27" fill="${col}" opacity=".18"/><circle cx="32" cy="34" r="22" fill="none" stroke="${col}" stroke-width="1" opacity=".5" class="ap"/>`;
  if(rank>=1&&job!=='neet') back+=`<path class="aw" d="M21 34 Q14 50 12 60 L52 60 Q50 50 43 34 Z" fill="${dark}" stroke="${D}" stroke-width="1"/>`;
  // 体：無職はジャージ（リクルートスーツを着ているとスーツ）、見習い？は「？」の服
  if(job==='neet'){ const suit=typeof neetA==='function'&&neetA();
    body = suit ? `<path d="M21 36 h22 l2 20 h-26z" fill="#2b2f45" stroke="${D}"/><path d="M28 36 l4 8 l4 -8z" fill="#fff"/><path d="M31.2 38 h1.6 l1 9 l-1.8 2 l-1.8 -2z" fill="#c22"/>`
      : `<path d="M21 36 h22 l2 20 h-26z" fill="#2f5fd0" stroke="${D}"/><path d="M24 37 v19 M40 37 v19" stroke="#fff" stroke-width="1.6"/><path d="M32 37 v19" stroke="#ddd" stroke-width=".8"/>`;
    body+=`<path d="M23 56 h7 v4 h-8z M34 56 h7 l1 4 h-8z" fill="${suit?'#111':'#7a8'}" stroke="${D}" stroke-width=".8"/>`;
  } else if(job==='apprentice'){
    body=`<path d="M21 36 h22 l2 20 h-26z" fill="#c9b48a" stroke="${D}"/><text x="32" y="51" font-size="11" text-anchor="middle" fill="#6a5430" font-weight="bold">？</text><path d="M23 56 h7 v4 h-8z M34 56 h7 l1 4 h-8z" fill="#6a4a2a"/>`;
  } else {
    body=`<path d="M21 36 h22 l2 20 h-26z" fill="${col}" stroke="${D}"/><path d="M21 45 h23" stroke="${dark}" stroke-width="2.4"/><circle cx="32" cy="45" r="1.6" fill="#ffd34d"/><path d="M23 56 h7 v4 h-8z M34 56 h7 l1 4 h-8z" fill="#4a3a2a"/>`;
  }
  // 顔
  face=`<circle cx="32" cy="25" r="12" fill="#ffe0c4" stroke="${D}" stroke-width="1.2"/>`;
  if(hat!=='helm'&&hat!=='hood'&&hat!=='wizard'&&hat!=='tophat') face+=`<path d="M20 24 C19 12 45 12 44 24 C40 18 34 17 30 19 C26 17 22 20 20 24Z" fill="${hair}"/>`;
  if(job==='neet') face+=`<path d="M24 26 q2.5 -1.6 5 0 M35 26 q2.5 -1.6 5 0" stroke="${D}" stroke-width="1.4" fill="none"/><path d="M29 31 h6" stroke="${D}" stroke-width="1.2"/>`;
  else face+=`<g class="ab"><ellipse cx="27" cy="26" rx="1.8" ry="2.4" fill="${D}"/><ellipse cx="37" cy="26" rx="1.8" ry="2.4" fill="${D}"/><circle cx="26.4" cy="25.2" r=".7" fill="#fff"/><circle cx="36.4" cy="25.2" r=".7" fill="#fff"/></g><path d="M29.5 31 q2.5 2 5 0" stroke="${D}" stroke-width="1.2" fill="none"/><ellipse cx="24" cy="30" rx="2" ry="1.1" fill="#ff9eb0" opacity=".6"/><ellipse cx="40" cy="30" rx="2" ry="1.1" fill="#ff9eb0" opacity=".6"/>`;
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="art art-hero"><g class="abob">${back}${body}<path d="M17 40 q-2 6 1 10 M47 40 q2 6 -1 10" stroke="#ffe0c4" stroke-width="3.4" stroke-linecap="round" fill="none"/>${face}${heroHat(hat,col,hair)}${heroProp(prop,col)}</g></svg>`;
}

function finalSVG(hue){
  let ring=''; for(let i=0;i<10;i++){ const t=i/10*6.283; ring+=`<text x="${f1(32+Math.cos(t)*24)}" y="${f1(34+Math.sin(t)*24)}" font-size="7" text-anchor="middle" fill="hsl(${(hue+i*36)%360},90%,70%)" font-weight="bold">${i}</text>`; }
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="art art-final"><defs><radialGradient id="fg${++artUid}"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="hsl(${hue},90%,60%)"/><stop offset="1" stop-color="#0a0418"/></radialGradient></defs>`+
    `<g class="aspin">${ring}</g><circle cx="32" cy="32" r="15" fill="url(#fg${artUid})" stroke="#000" stroke-width="1"/>`+
    `<g class="ab"><path d="M20 32 Q32 22 44 32 Q32 42 20 32Z" fill="#fff"/><circle cx="32" cy="32" r="4.5" fill="#000"/><text x="32" y="34.6" font-size="6" text-anchor="middle" fill="#fff">∞</text></g></svg>`;
}
